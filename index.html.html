function renderAgro(){agroNavActive();if(state.agroView==='report')return renderAgroReport();if(state.agroView==='update')return renderAgroUpdate();document.getElementById('workspace').innerHTML=`<div class="agro-shell"><div class="agro-head"><div><div class="smallcaps">Inteligencia</div><h1>Reporte Agro Paraguay</h1><div class="page-sub">Cosecha y comercio exterior de soja, maíz, trigo y arroz.</div></div><span class="badge navy">Datos ficticios para la demostración</span></div><div class="agro-card agro-release"><div><div class="agro-version">${agroSnapshot.version} · Snapshot histórico</div><h2>Soja, Maíz, Trigo & Arroz</h2><p>Estado de cosecha, volúmenes de exportación e importación y estimaciones de producción · Campaña 2025/26.</p><div class="agro-meta"><span class="agro-badge">${agroSnapshot.date} · ${agroSnapshot.status}</span><span class="badge navy">Sin precios · sólo volúmenes</span></div><div class="agro-note">Las cifras corresponden al reporte publicado el 24 de agosto de 2026. No representan información en tiempo real.</div><div class="agro-actions" style="justify-content:flex-start;margin-top:18px"><button class="primary-btn" onclick="openAgroReport()">Ver reporte</button><button class="secondary-btn" onclick="prepareAgroUpdate()">Preparar actualización</button></div></div><div class="agro-main-visual"><img src="${AGRO_IMAGE}" alt="Vista previa del Reporte Agro Paraguay"></div></div><div class="agro-process"><span>Fuentes</span><b>→</b><span>Datos</span><b>→</b><span>Revisión</span><b>→</b><span>Borrador</span><b>→</b><span>Publicación</span></div></div>`}
function openAgroReport(){state.agroView='report';render();window.scrollTo({top:0,behavior:'smooth'})}
function prepareAgroUpdate(){state.agroView='update';render();window.scrollTo({top:0,behavior:'smooth'})}
function renderAgroReport(){document.getElementById('workspace').innerHTML=`<div class="agro-shell"><div class="agro-toolbar"><div class="agro-toolbar-title"><button class="back-btn" style="margin:0" onclick="state.agroView='home';render()">← Volver</button><strong>24 Ago 2026 · Publicado</strong></div><button class="secondary-btn" onclick="printAgroReport()">Ver / guardar PDF</button></div><div class="agro-report-wrap"><img class="agro-report-img" src="${AGRO_IMAGE}" alt="Reporte Agro Paraguay del 24 de agosto de 2026"></div><div class="agro-view-secondary"><button class="secondary-btn" onclick="showAgroSources()">Ver fuentes citadas</button></div></div>`}
function renderAgroUpdate(){const rows=[['good','Soja','Datos disponibles','soja'],['warn','Maíz','Requiere revisar si existe un dato nacional más reciente','maiz'],['good','Trigo','Datos disponibles','trigo'],['muted','Arroz','Sin dato nacional reciente','arroz']];document.getElementById('workspace').innerHTML=`<div class="agro-shell"><button class="back-btn" onclick="state.agroView='home';render()">← Volver al reporte</button><div class="agro-card"><div class="agro-work-head"><div class="smallcaps">Próxima edición</div><h2>Preparar actualización</h2><p>Esta vista muestra qué datos necesitarían revisión. No consulta fuentes ni actualiza cifras automáticamente.</p></div><div class="agro-status-list">${rows.map(r=>`<div class="agro-status-row"><span class="agro-dot ${r[0]}"></span><strong>${r[1]}</strong><div class="agro-status-copy">${r[2]}</div><button class="agro-source-btn" onclick="showAgroMetric('${r[3]}')">Ver detalle</button></div>`).join('')}</div><div class="agro-update-footer"><p>Una actualización futura crearía otra edición. El snapshot del 24 Ago 2026 se conserva.</p><button class="primary-btn" onclick="toast('Falta revisar las fuentes antes de crear un borrador.')">Crear borrador</button></div><div class="agro-process"><span>Fuentes por revisar</span><b>→</b><span>Datos</span><b>→</b><span>Validación</span><b>→</b><span>Borrador</span></div></div></div>`}
function showAgroMetric(key){const m=agroSnapshot.metrics[key];if(!m)return;openModal(`<div class="modal-head"><div class="modal-title">${m.title}</div><button class="modal-close" aria-label="Cerrar" onclick="closeModal()">×</button></div><div class="modal-body"><div class="agro-source-detail"><div>Valor</div><div>${m.value}</div><div>Período</div><div>${m.period}</div><div>Fuente</div><div>${m.source}</div><div>Fecha de referencia</div><div>${m.reference}</div><div>Tipo</div><div>${m.method}</div><div>Nota</div><div>${m.note}</div></div><p class="agro-source-list">Dato reproducido del snapshot histórico adjunto. La disponibilidad técnica y el método de actualización de cada fuente quedan pendientes de validación.</p></div>`)}
function showAgroSources(){openModal(`<div class="modal-head"><div class="modal-title">Fuentes citadas en el reporte</div><button class="modal-close" aria-label="Cerrar" onclick="closeModal()">×</button></div><div class="modal-body"><p class="agro-source-list" style="font-size:12px;color:var(--text)">CAPECO, INBIO, UGP, La Nación, Última Hora, Prensa Mercosur, 1000 Noticias, Infonegocios, ABC Rural, Bichos de Campo, Agrotabara y Poder Agropecuario.</p><p class="agro-source-list">La demostración no afirma que estas fuentes tengan API, permitan extracción automática o estén integradas al sistema.</p></div>`)}
function printAgroReport(){window.print()}

function gjEvidence(){return `<div class="gj-section" style="margin-top:0"><div class="gj-section-head"><div><h3>Cobertura</h3><p>18 evidencias registradas · 10 fotografías disponibles para el reporte.</p></div>${gjBadge('4 categorías cubiertas','ok')}</div><div class="gj-grid"><div class="gj-card"><h3>Operación</h3><div class="gj-value">6</div><div class="gj-meta">Jornadas e inspección general</div></div><div class="gj-card"><h3>Muestras y análisis</h3><div class="gj-value">7</div><div class="gj-meta">Toma, identificación y lectura</div></div><div class="gj-card"><h3>Incidencias</h3><div class="gj-value">3</div><div class="gj-meta">Observación y variación</div></div><div class="gj-card"><h3>Seguridad y cierre</h3><div class="gj-value">2</div><div class="gj-meta">1 faltante</div></div></div>${!gj.equipmentEvidence?'<div class="gj-alert">Falta vincular la evidencia de verificación del equipo antes de la lectura repetida · responsable: Diego Benítez.</div><button class="primary-btn" onclick="gjRegisterEquipmentEvidence()">Revisar evidencia faltante</button>':'<button class="primary-btn" onclick="gjOpenReportSelection()">Preparar reporte fotográfico</button>'}</div><div class="gj-section"><h3>Detalle vinculado</h3><p class="page-sub">El dato registra qué ocurrió. La evidencia respalda ese dato.</p><div class="gj-evidence-grid">${[['Jornada 1','Dato: inicio y fin registrados','8 fotos y registro de horario'],['Muestra MS-0128-04','Dato: toma 10 sep 09:17','Foto, identificación y cadena de despacho'],['Análisis R-IN-04','Dato: resultado corregido','Lectura original, repetición y motivo'],['Incidencia oeste','Dato: observación en descarga','2 fotos y nota de campo'],['Seguridad','Dato: EPP verificado','Lista y foto de ingreso'],['Variación','Dato: 1 h 35 min adicional','Registro horario y nota del inspector']].map(x=>`<div class="gj-ev"><strong>${x[0]}</strong><p>${x[1]}</p><p class="gj-meta">Evidencia: ${x[2]}</p></div>`).join('')}</div></div>`}
function gjReports(){if(gj.reportView==='selection')return gjReportSelection();if(gj.reportView==='draft')return gjReportDraft();let photoStatus=gj.photo.status==='issued'?`V${gj.photo.version} — Emitido`:gj.photo.status==='approved'?`V${gj.photo.version} — Aprobado`:'Listo para borrador';return `<div class="gj-two"><div class="gj-section" style="margin-top:0"><div class="gj-section-head"><div><h3>Reporte Fotográfico</h3><p>10 fotos registradas · 10 seleccionables · 4 categorías cubiertas</p></div>${gjBadge(photoStatus,gj.photo.status==='issued'?'ok':'info')}</div>${gj.photo.needsReview?'<div class="gj-alert">Cambió información del Trabajo. Esta versión requiere revisión.</div>':''}<div class="gj-actions">${gj.photo.status==='ready'?'<button class="primary-btn" onclick="gjOpenReportSelection()">Generar borrador</button>':gj.photo.status==='approved'?'<button class="primary-btn" onclick="gjSendDialog()">Registrar envío</button>':gj.photo.status==='issued'?'<button class="secondary-btn" onclick="gjPrintReport()">Ver / guardar PDF</button>':'<button class="primary-btn" onclick="gjShowDraft()">Ver borrador</button>'}${gj.photo.status==='issued'?`<details class="gj-menu"><summary>•••</summary><div class="gj-menu-items"><button onclick="gjNewVersion()">Crear nueva versión</button></div></details>`:''}</div></div><div class="gj-section" style="margin-top:0"><div class="gj-section-head"><div><h3>Reporte de Calidad</h3><p>${gj.lab.reviewed?'Resultado revisado. Disponible para preparar borrador.':'Resultado de laboratorio pendiente.'}</p></div>${gjBadge(gj.lab.reviewed?'Listo para borrador':'Bloqueado',gj.lab.reviewed?'info':'block')}</div></div></div><div class="gj-section"><h3>Versiones</h3>${gjVersionList()}</div>`}
function gjReportSelection(){return `<div class="gj-section" style="margin-top:0"><div class="gj-section-head"><div><div class="smallcaps">Preparación</div><h3>Reporte Fotográfico</h3><p>Trabajo 2026-0128 · Río Sur Commodities · Puerto Industrial Villeta</p></div>${gjBadge(`${gj.photos.length} registradas · ${gjSelected().length} seleccionadas`,'info')}</div><p class="gj-meta">Imágenes ficticias utilizadas únicamente en esta demostración.</p><div class="gj-photo-grid">${gj.photos.map(p=>`<article class="gj-photo"><img src="${p.src}" alt="${gjEsc(p.title)}"><div class="gj-photo-body"><div class="gj-photo-meta">10 sep 2026 · ${p.at}<br>${gjEsc(p.inspector)} · ${gjEsc(p.context)}</div><label>Categoría<select onchange="gjUpdatePhoto(${p.id},'category',this.value)">${['Inspección general','Muestreo','Condición del producto','Incidencia / observación'].map(x=>`<option ${x===p.category?'selected':''}>${x}</option>`).join('')}</select></label><label>Descripción<input type="text" value="${gjEsc(p.caption)}" onchange="gjUpdatePhoto(${p.id},'caption',this.value)"></label><label class="gj-photo-toggle"><input type="checkbox" ${p.include?'checked':''} onchange="gjUpdatePhoto(${p.id},'include',this.checked)"> Incluir en el reporte</label></div></article>`).join('')}</div><div class="gj-actions"><button class="secondary-btn" onclick="gj.reportView='cards';gjSave();renderGoldenJob()">Volver</button><button class="primary-btn" onclick="gjShowDraft()">Ver borrador</button></div></div>`}
function gjReportDraft(){let status=gj.photo.status;return `<div class="gj-no-print"><div class="gj-section" style="margin-top:0"><div class="gj-section-head"><div><h3>Reporte Fotográfico · V${gj.photo.version}</h3><p>${status==='draft'?'Borrador pendiente de aprobación':status==='approved'?'Aprobado · falta registrar envío':'Versión emitida'}</p></div>${gjBadge(status==='draft'?'Borrador':status==='approved'?'Aprobado':'Emitido',status==='draft'?'warn':'ok')}</div><div class="gj-actions">${status==='draft'?'<button class="secondary-btn" onclick="gj.reportView=\'selection\';renderGoldenJob()">Editar selección</button><button class="primary-btn" onclick="gjApproveReport()">Aprobar reporte</button>':status==='approved'?'<button class="secondary-btn" onclick="gjPrintReport()">Ver / guardar PDF</button><button class="primary-btn" onclick="gjSendDialog()">Registrar envío</button>':'<button class="secondary-btn" onclick="gjPrintReport()">Ver / guardar PDF</button>'}</div></div></div>${gjReportDocument()}<div class="gj-section gj-no-print"><h3>Versiones</h3>${gjVersionList()}</div>`}
function gjVersionList(){let archived=gj.photo.issued.filter(v=>!(gj.photo.status==='issued'&&v.version===gj.photo.version)).map(v=>`<div class="gj-version">${gjBadge(`V${v.version} — Emitido`,'ok')}<span>${new Date(v.at).toLocaleString('es-PY')} · ${gjEsc(v.channel)} · versión conservada</span></div>`).join('');let current=gj.photo.status==='issued'?`<div class="gj-version">${gjBadge(`V${gj.photo.version} — Emitido`,'ok')}<span>Borrador → Aprobado → Emitido · versión conservada</span></div>`:`<div class="gj-version">${gjBadge(`V${gj.photo.version} — ${gj.photo.status==='ready'?'Preparación':gj.photo.status==='draft'?'Borrador':'Aprobado'}`,gj.photo.status==='draft'?'warn':'info')}<span>${gj.photo.status==='approved'?'Borrador → Aprobado':'Versión actual'}</span></div>`;return archived+current}

function gjFinance(){let ready=gj.close.closed&&gj.photo.status==='issued'&&!gj.photo.needsReview;return `<div class="gj-grid"><div class="gj-card"><h3>Acordado</h3><div class="gj-value">USD 1.240</div><p>Servicio y una jornada · AC-DEMO-0128.</p><div class="gj-meta">Acuerdo sintético aprobado</div></div><div class="gj-card"><h3>Ejecutado</h3><div class="gj-value">2 jornadas</div><p>Servicio, muestreo, análisis y 1 h 35 min adicional.</p></div><div class="gj-card"><h3>Facturable</h3><div class="gj-value">USD ${gj.variation.billing==='Aprobada como adicional'?'1.425':'1.240'}</div><p>La variación figura como ${gj.variation.billing.toLowerCase()}.</p></div><div class="gj-card"><h3>Estado</h3><div class="gj-value">${ready?'Listo':'No listo'}</div><p>${ready?'Cierre y reporte emitido.':'Faltan cierre operativo y/o reporte emitido.'}</p></div></div>${gj.photo.needsReview?'<div class="gj-alert block">Cambió información upstream. Reportes y detalle de facturación requieren revisión.</div>':''}<div class="gj-section"><h3>Conceptos</h3><div class="gj-table-wrap"><table class="gj-table"><thead><tr><th>Concepto</th><th>Acordado</th><th>Ejecutado</th><th>Facturable</th><th>Motivo</th></tr></thead><tbody><tr><td>Inspección y muestreo</td><td>USD 1.100</td><td>Realizado</td><td>USD 1.100</td><td>Incluido en acuerdo</td></tr><tr><td>Análisis</td><td>USD 140</td><td>En laboratorio</td><td>USD 140</td><td>Incluido en acuerdo</td></tr><tr><td>Tiempo adicional</td><td>No incluido</td><td>1 h 35 min</td><td>${gj.variation.billing==='Aprobada como adicional'?'USD 185':'USD 0'}</td><td>${gj.variation.billing}</td></tr></tbody></table></div>${!gj.invoice&&ready?'<div class="gj-actions"><button class="primary-btn" onclick="gjCreateInvoice()">Crear factura demo</button></div>':''}${gj.invoice?`<div class="gj-row"><div>Factura</div><strong>${gj.invoice.id} · ${gj.invoice.status}</strong><span>Vence ${gj.invoice.due}</span></div>${gj.invoice.needsReview?'<div class="gj-alert">La factura demo requiere revisión por el cambio posterior al cierre.</div>':''}${!gj.invoice.paid?'<div class="gj-actions"><button class="primary-btn" onclick="gjRecordPayment()">Registrar cobro demo</button></div>':''}`:''}<p class="gj-meta">Demostración sin integración contable o fiscal.</p></div>`}
function gjEvents(limit){return `<div class="gj-timeline">${gj.events.slice(0,limit||999).map(e=>`<div class="gj-event"><div class="gj-time">${gjEsc(e.at)}</div><span class="gj-event-dot"></span><div class="gj-event-body"><strong>${gjEsc(e.title)}</strong>${gjEsc(e.text)}<small>${gjEsc(e.who)}${e.detail?' · '+gjEsc(e.detail):''}</small></div></div>`).join('')}</div>`}
function gjActivity(){return `<div class="gj-section" style="margin-top:0"><div class="gj-section-head"><div><h3>Actividad del Trabajo</h3><p>Eventos de negocio. Los cambios sensibles conservan antes, después, autor, fecha y motivo.</p></div>${gj.close.closed?'<button class="secondary-btn" onclick="gjReopenDialog()">Reabrir cierre</button>':''}</div>${gjEvents()}</div>`}
function renderGoldenJob(){state.selectedJob='2026-0128';state.jobDetailTab=gj.tab;const tabNames=[['summary','Resumen'],['operation','Operación'],['evidence','Evidencias'],['reports','Reportes'],['finance','Finanzas'],['activity','Actividad']];let body=gj.tab==='summary'?gjSummary():gj.tab==='operation'?gjOperation():gj.tab==='evidence'?gjEvidence():gj.tab==='reports'?gjReports():gj.tab==='finance'?gjFinance():gjActivity();document.getElementById('workspace').innerHTML=`<div class="gj-shell"><button class="back-btn" onclick="go('jobs')">← Volver a Trabajos</button><div class="gj-head"><div><div class="job-id-large">TRABAJO 2026-0128 · CASO SINTÉTICO</div><h1>Río Sur Commodities</h1><div class="page-sub">Inspección + muestreo + análisis de calidad · Puerto Industrial Villeta</div></div><div class="gj-head-actions">${gjBadge(gjStatus(),gjTone()==='success'?'ok':gjTone()==='warning'?'warn':'info')}<details class="gj-menu"><summary>•••</summary><div class="gj-menu-items"><button onclick="gjSetTab('activity')">Ver actividad</button>${gj.close.closed?'<button onclick="gjReopenDialog()">Reabrir cierre</button>':''}<button onclick="toast('Expediente sintético de demostración.')">Acerca de este caso</button></div></details></div></div><div class="gj-tabs">${tabNames.map(t=>`<button class="gj-tab ${gj.tab===t[0]?'active':''}" onclick="gjSetTab('${t[0]}')">${t[1]}</button>`).join('')}</div><div class="gj-body">${body}</div></div>`;document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.key==='jobs'));document.getElementById('sidebar').classList.remove('open')}
const gjOldGetJobs=getJobs;getJobs=function(){return gjOldGetJobs().map(j=>j.id==='2026-0128'?Object.assign({},j,{phase:gj.close.closed?'Cierre operativo':'Resultados',status:gjStatus(),tone:gjTone(),next:gjNext().label,owner:gjNext().owner,service:'Inspección + muestreo + análisis de calidad',location:'Puerto Industrial Villeta',product:'Soja',evidence:18,finance:gj.close.closed?'Pendiente de facturación':'No listo para facturar'}):j)};
const gjOldRenderJobDetail=renderJobDetail;renderJobDetail=function(){if(state.selectedJob==='2026-0128')return renderGoldenJob();return gjOldRenderJobDetail()};
</script>

<style>/* V04 surgical polish: hide unfinished global destinations without removing their code. */
#sidebar .nav-btn[data-key="clients"],
#sidebar .nav-btn[data-key="operations"],
#sidebar .nav-btn[data-key="evidence"],
#sidebar .nav-btn[data-key="reports"],
#sidebar .nav-btn[data-key="finance"],
#sidebar .nav-btn[data-key="assistant"]{display:none}

@media(max-width:520px){
  .priority{grid-template-columns:6px minmax(0,1fr) 18px;gap:9px 10px;align-items:start;padding:13px 11px}
  .priority>.priority-bar{grid-column:1;grid-row:1 / 3;align-self:stretch;width:4px;height:auto;min-height:58px}
  .priority>div:nth-child(2){grid-column:2;grid-row:1;min-width:0}
  .priority>.badge{grid-column:2;grid-row:2;justify-self:start;white-space:normal;text-align:left;line-height:1.35}
  .priority>.chev{grid-column:3;grid-row:1 / 3;align-self:center}
  .priority-title{font-size:12px;line-height:1.4}
  .priority-sub,.priority-next{font-size:10.5px;line-height:1.45}
}
</style>
