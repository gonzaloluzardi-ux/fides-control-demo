<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fides Control — Concept Demo v0.3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>:root{
  --brand:#2D3460;--brand-dark:#252B52;--brand-mid:#56618F;--brand-soft:#F0F1F7;
  --bg:#F5F6F9;--surface:#fff;--surface-soft:#FAFBFC;--ink:#283056;--text:#46506F;--muted:#78809A;
  --line:#E2E5EC;--line-strong:#D3D8E3;--danger:#D94149;--danger-soft:#FDECEE;
  --warning:#D88A12;--warning-soft:#FFF4DF;--success:#188454;--success-soft:#EAF6F0;
  --info:#6077A3;--info-soft:#EEF1F7;--sidebar:236px;--radius:12px;
  --shadow:0 8px 22px rgba(45,52,96,.055)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
body{font-family:"Inter","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;font-size:13px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,.section-title,.card-title,.job-title,.quote-title{font-family:"Manrope","Inter",sans-serif}
.icon{width:19px;height:19px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto}
.icon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:"IBM Plex Mono",monospace}
.smallcaps{font-family:"IBM Plex Mono";font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Shell */
.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar);background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:40}
.brand{height:162px;display:flex;justify-content:center;align-items:center;padding-top:6px}
.brand img{width:126px;height:126px;object-fit:contain}
.nav{padding:2px 14px;display:flex;flex-direction:column;gap:3px}
.nav-btn{width:100%;height:45px;border:0;border-radius:10px;background:transparent;display:flex;align-items:center;gap:12px;padding:0 13px;text-align:left;color:var(--brand);font-size:13.5px;font-weight:500}
.nav-btn:hover{background:#F5F6F9}
.nav-btn.active{background:var(--brand);color:#fff;box-shadow:0 6px 15px rgba(45,52,96,.14)}
.nav-badge{margin-left:auto;min-width:25px;height:25px;padding:0 7px;border-radius:999px;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:700}
.nav-btn.active .nav-badge{background:#fff;color:var(--brand)}
.sidebar-bottom{margin-top:auto;padding:14px 21px 18px}
.sidebar-rule{height:1px;background:var(--line);margin-bottom:16px}
.user-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.avatar{width:39px;height:39px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:11px}
.user-name{font-size:12px;font-weight:700}.user-role{font-size:10.5px;color:var(--muted);margin-top:2px}
.settings{display:flex;align-items:center;gap:9px;color:var(--brand);font-size:12px}

.app{margin-left:var(--sidebar);min-height:100vh}
.topbar{height:68px;position:sticky;top:0;z-index:25;background:rgba(245,246,249,.94);backdrop-filter:blur(10px);border-bottom:1px solid rgba(226,229,236,.9);display:flex;align-items:center;justify-content:flex-end;padding:0 28px}
.top-tools{display:flex;align-items:center;gap:9px}
.search-trigger{height:42px;width:350px;border:1px solid var(--line);background:#fff;border-radius:22px;padding:0 15px;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11.5px;text-align:left;box-shadow:0 4px 14px rgba(45,52,96,.035)}
.bell{width:42px;height:42px;border:1px solid var(--line);background:#fff;border-radius:50%;display:grid;place-items:center;color:var(--brand);position:relative;box-shadow:0 4px 14px rgba(45,52,96,.035)}
.bell::after{content:"";position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:#E5474F;border:2px solid #fff}
.workspace{padding:27px 28px 34px;max-width:1660px;margin:0 auto}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:20px}
h1{font-size:34px;line-height:1.06;letter-spacing:-.04em;margin:5px 0 0;color:var(--brand);font-weight:800}
.page-sub{font-size:13px;color:var(--muted);line-height:1.55;margin-top:7px;max-width:820px}
.back-btn{border:0;background:transparent;color:var(--brand);font-size:12px;font-weight:600;padding:0;display:flex;align-items:center;gap:6px;margin-bottom:10px}

/* Generic */
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:17px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}
.section-title{font-size:17px;line-height:1.2;font-weight:700;color:var(--brand);letter-spacing:-.02em}
.text-btn{border:0;background:transparent;color:var(--brand);font-size:11px;font-weight:700;padding:5px}
.primary-btn,.secondary-btn,.ghost-btn{height:40px;border-radius:8px;padding:0 13px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.primary-btn{border:1px solid var(--brand);background:var(--brand);color:#fff}
.secondary-btn{border:1px solid var(--line-strong);background:#fff;color:var(--brand)}
.ghost-btn{border:0;background:transparent;color:var(--brand);padding:0 6px}
.primary-btn:hover{background:var(--brand-dark)}.secondary-btn:hover{background:#F8F9FB}
.badge{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:700;white-space:nowrap}
.badge.danger{background:var(--danger-soft);color:var(--danger)}.badge.warning{background:var(--warning-soft);color:#B96E00}
.badge.success{background:var(--success-soft);color:var(--success)}.badge.navy{background:var(--brand-soft);color:var(--brand)}
.badge.info{background:var(--info-soft);color:var(--info)}

/* Home */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.kpi{min-height:104px;background:#fff;border:1px solid var(--line);border-radius:11px;padding:16px;box-shadow:0 5px 16px rgba(45,52,96,.04);position:relative;cursor:default}
.kpi.clickable{cursor:pointer}.kpi.clickable:hover{border-color:#C9CEDC}
.kpi-top{display:flex;align-items:center;gap:8px;color:var(--brand)}
.kpi-top .icon{width:17px;height:17px}.kpi-label{font-size:12px;font-weight:600;color:var(--text)}
.kpi-value{font-family:"Manrope";font-size:28px;font-weight:800;letter-spacing:-.035em;color:var(--brand);margin-top:9px}
.kpi-note{font-size:10.5px;color:var(--muted);margin-top:5px}
.kpi-attention{border-top:3px solid var(--danger)}.kpi-finance{border-top:3px solid var(--success)}
.home-grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(320px,.78fr);gap:14px}
.priority-list{display:flex;flex-direction:column;gap:7px}
.priority{display:grid;grid-template-columns:8px minmax(0,1fr) auto 18px;gap:12px;align-items:center;padding:12px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer}
.priority:hover{background:#FBFBFD}.priority-bar{width:4px;height:34px;border-radius:9px}
.priority-bar.danger{background:var(--danger)}.priority-bar.warning{background:var(--warning)}.priority-bar.info{background:var(--info)}
.priority-title{font-size:12px;font-weight:700;color:var(--ink)}.priority-sub{font-size:10.5px;color:var(--muted);margin-top:3px}.priority-next{font-size:10px;color:var(--text);margin-top:4px}.chev{color:var(--muted);font-size:18px}
.meeting-row{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:12px 3px 2px;margin-top:5px}
.meeting-time{font-family:"IBM Plex Mono";font-size:10px;color:var(--brand);font-weight:500;min-width:52px}
.side-stack{display:grid;gap:14px;align-content:start}
.activity-list{display:flex;flex-direction:column}
.activity{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.activity:last-child{border-bottom:0}.activity-icon{color:var(--brand);display:grid;place-items:center}
.activity-title{font-size:11.5px;font-weight:700}.activity-sub{font-size:10px;color:var(--muted);margin-top:2px}.activity-time{font-size:9.5px;color:var(--muted)}
.assistant-box{background:linear-gradient(135deg,#F4F5FA,#FBFBFD);border:1px solid var(--line);border-radius:10px;padding:12px}
.assistant-head{display:flex;align-items:flex-start;gap:9px}.assistant-spark{font-size:18px;color:var(--brand-mid)}
.assistant-title{font-size:11.5px;font-weight:700}.assistant-copy{font-size:10.5px;color:var(--muted);line-height:1.45;margin-top:2px}
.assistant-actions{display:grid;gap:6px;margin-top:10px}.assistant-action{min-height:35px;border:1px solid var(--line);background:#fff;border-radius:7px;padding:0 10px;font-size:10.5px;color:var(--brand);display:flex;align-items:center;justify-content:space-between}
.action-strip{margin-top:14px;background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:0 5px 16px rgba(45,52,96,.035);display:grid;grid-template-columns:repeat(4,1fr);overflow:hidden}
.action-link{min-height:76px;border:0;border-right:1px solid var(--line);background:#fff;padding:14px;text-align:left;display:grid;grid-template-columns:24px 1fr 14px;gap:9px;align-items:center;color:var(--brand)}
.action-link:last-child{border-right:0}.action-link:hover{background:#FAFAFC}.action-link .icon{width:20px;height:20px}
.action-title{font-size:11.5px;font-weight:700}.action-sub{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.35}

/* Quote workflow */
.stepper{display:grid;grid-template-columns:repeat(5,1fr);gap:0;border-bottom:1px solid var(--line);margin-bottom:18px}
.step{position:relative;padding:0 8px 12px;display:flex;align-items:center;gap:8px;color:var(--muted)}
.step.reached{cursor:pointer}.step::after{content:"";position:absolute;left:8px;right:8px;bottom:-1px;height:2px;background:transparent}
.step.active::after{background:var(--brand)}.step.done::after{background:#BDC4D3}
.step-num{width:29px;height:29px;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center;background:#fff;font-size:10px;font-weight:700}
.step.active .step-num{background:var(--brand);border-color:var(--brand);color:#fff}.step.done .step-num{background:var(--success);border-color:var(--success);color:#fff}
.step-label{font-size:10.5px;font-weight:600}.step.active .step-label{color:var(--brand);font-weight:700}
.quote-context{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:9px;margin-bottom:12px}
.quote-context-main{display:flex;align-items:center;gap:10px}.quote-context-icon{width:30px;height:30px;border-radius:8px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.quote-context-title{font-size:11.5px;font-weight:700}.quote-context-sub{font-size:10px;color:var(--muted);margin-top:2px}
.quote-request-layout{display:grid;grid-template-columns:minmax(210px,.72fr) minmax(360px,1.35fr) minmax(220px,.72fr);gap:12px;align-items:start}
.quote-review-layout{display:grid;grid-template-columns:minmax(280px,.72fr) minmax(560px,1.55fr);gap:14px;align-items:start}
.quote-proposal-layout{display:grid;grid-template-columns:minmax(560px,1.55fr) minmax(250px,.7fr);gap:14px;align-items:start}
.quote-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);min-width:0}
.quote-title{font-size:17px;font-weight:700;color:var(--brand);letter-spacing:-.02em}.quote-copy{font-size:11px;color:var(--muted);line-height:1.5;margin-top:4px}
.request-tabs{display:flex;gap:5px;margin:10px 0}.request-tab{padding:6px 8px;border-radius:6px;font-size:10px;color:var(--muted)}.request-tab.active{background:var(--brand-soft);color:var(--brand);font-weight:700}
.request-item{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;padding:10px;border:1px solid var(--line);border-radius:8px;margin-top:7px}
.request-item.active{background:#FAFAFC;border-color:#AEB5CB}.request-item-icon{width:30px;height:30px;background:var(--brand-soft);color:var(--brand);border-radius:8px;display:grid;place-items:center}
.request-name{font-size:11px;font-weight:700}.request-desc{font-size:10px;color:var(--muted);margin-top:2px;line-height:1.35}.request-time{font-size:9px;color:var(--muted)}
.message-box{background:#F7F8FB;border-radius:9px;padding:11px;margin-top:12px}.message-label{font-size:10px;font-weight:700;color:var(--brand);margin-bottom:7px}.message-body{background:#fff;border:1px solid var(--line);border-radius:7px;padding:13px;font-size:11px;line-height:1.6;color:var(--text)}
.automation-note{margin-top:10px;display:flex;gap:8px;padding:9px 10px;border-radius:8px;background:#F3F5FA;color:var(--brand);font-size:10px;line-height:1.4}
.detected-list{margin-top:9px}.detected-row{display:grid;grid-template-columns:130px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.detected-row:last-child{border-bottom:0}.detected-key{font-size:10px;color:var(--muted)}.detected-value{font-size:11px;font-weight:600}.detect-tag{font-family:"IBM Plex Mono";font-size:8.5px;color:var(--success);text-transform:uppercase}.detect-tag.review{color:var(--warning)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}
.field label{font-size:10px;color:var(--muted);font-weight:600}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:7px;background:#fff;padding:9px 10px;font-size:11.5px;outline:none}.field textarea{min-height:72px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{border-color:#A2AAC4;box-shadow:0 0 0 3px rgba(45,52,96,.05)}
.pricing-builder{margin-top:12px;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.pricing-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:12px;border-bottom:1px solid var(--line);background:#FAFBFC}
.pricing-title{font-size:11.5px;font-weight:700;color:var(--brand)}.pricing-copy{font-size:10px;color:var(--muted);line-height:1.4;margin-top:2px}
.add-line{height:31px;border:1px solid var(--line-strong);background:#fff;border-radius:7px;padding:0 9px;font-size:9.5px;font-weight:700;color:var(--brand);white-space:nowrap}
.rate-scroll{overflow-x:auto}.rate-grid{min-width:720px;padding:0 11px 9px}
.rate-header,.rate-row{display:grid;grid-template-columns:155px 150px 72px 88px 68px 92px 28px;gap:7px;align-items:center}
.rate-header{height:42px;font-family:"IBM Plex Mono";font-size:8.5px;text-transform:uppercase;color:#6D7591;border-bottom:1px solid var(--line)}
.rate-row{min-height:53px;border-bottom:1px solid var(--line)}.rate-row:last-child{border-bottom:0}
.rate-input,.rate-select{height:35px;width:100%;border:1px solid var(--line);border-radius:6px;background:#fff;padding:0 7px;font-size:10.5px}
.rate-total{font-family:"IBM Plex Mono";font-size:9px;text-align:right;color:var(--brand)}.remove-line{width:25px;height:25px;border:0;background:transparent;border-radius:5px;color:#9BA2B6;font-size:16px}.remove-line:hover{background:var(--danger-soft);color:var(--danger)}
.pricing-total{display:flex;justify-content:space-between;align-items:center;padding:12px;border-top:1px solid var(--line);font-size:12px;font-weight:700;color:var(--brand)}
.editor-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.proposal-paper{background:#fff;border:1px solid var(--line);border-radius:10px;padding:24px;box-shadow:0 10px 28px rgba(45,52,96,.07)}
.proposal-top{display:flex;justify-content:space-between;gap:14px;padding-bottom:15px;border-bottom:2px solid var(--brand)}
.proposal-ref{font-family:"IBM Plex Mono";font-size:9px;color:var(--muted)}.proposal-client{font-family:"Manrope";font-size:21px;font-weight:800;color:var(--brand);margin-top:4px}
.proposal-meta{display:grid;grid-template-columns:140px 1fr;gap:8px;margin-top:17px;font-size:11px}.proposal-meta div:nth-child(odd){color:var(--muted)}.proposal-meta div:nth-child(even){font-weight:600}
.proposal-section{font-family:"Manrope";font-size:12px;font-weight:700;color:var(--brand);margin:22px 0 9px}
.proposal-table{width:100%;border-collapse:separate;border-spacing:0;font-size:11px}.proposal-table th{text-align:left;background:#F2F4F8;color:#68718D;padding:10px;font-size:10px;border-bottom:1px solid var(--line)}.proposal-table td{padding:12px 10px;border-bottom:1px solid var(--line)}.proposal-table .num{text-align:right}
.proposal-total{display:flex;justify-content:flex-end;gap:30px;padding-top:13px;font-size:13px;font-weight:800;color:var(--brand)}
.proposal-terms{background:#F8F9FB;border:1px solid var(--line);border-radius:7px;padding:11px;font-size:10.5px;line-height:1.5;color:var(--text)}
.share-panel{display:grid;gap:8px;margin-top:11px}.share-option{height:38px;border:1px solid var(--line);background:#fff;border-radius:7px;color:var(--brand);font-size:10.5px;font-weight:600;display:flex;align-items:center;gap:8px;padding:0 10px}.share-option:hover{background:#FAFAFC}
.status-box{padding:11px;border-radius:8px;background:var(--success-soft);color:var(--success);font-size:10.5px;line-height:1.45;margin:11px 0}
.success-state{text-align:center;padding:36px 20px}.success-mark{width:56px;height:56px;border-radius:50%;background:var(--success-soft);color:var(--success);display:grid;place-items:center;margin:0 auto 12px}.success-state h2{font-size:22px;color:var(--brand);margin:0}.success-state p{font-size:11.5px;line-height:1.55;color:var(--muted);max-width:530px;margin:8px auto 16px}

/* Jobs list */
.admin-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.admin-copy{font-size:10.5px;color:var(--muted);margin-top:2px}.admin-title{font-size:11.5px;font-weight:700;color:var(--brand)}
.filters{display:flex;gap:6px;flex-wrap:wrap}.filter-btn{height:31px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:0 10px;font-size:9.5px;color:var(--muted);font-weight:600}.filter-btn.active{background:var(--brand);border-color:var(--brand);color:#fff}
.jobs-panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.jobs-panel-head{display:flex;justify-content:space-between;align-items:center;padding:15px 16px;border-bottom:1px solid var(--line)}
.table-scroll{overflow:auto}.jobs-table{width:100%;min-width:1030px;border-collapse:collapse}
.jobs-table th{text-align:left;background:#F6F7FA;color:#626B88;font-family:"IBM Plex Mono";font-size:9.5px;font-weight:500;text-transform:uppercase;letter-spacing:.045em;padding:12px 13px;border-bottom:1px solid var(--line);white-space:nowrap}
.jobs-table td{font-size:11.5px;color:var(--text);padding:13px;border-bottom:1px solid var(--line);vertical-align:middle}.jobs-table tr:last-child td{border-bottom:0}.jobs-table tbody tr{cursor:pointer}.jobs-table tbody tr:hover{background:#FBFBFD}.job-id{font-family:"IBM Plex Mono";font-size:10px!important;color:var(--brand)!important;font-weight:500}

/* Job full-screen */
.job-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:14px}
.job-title{font-size:28px;font-weight:800;color:var(--brand);letter-spacing:-.035em;margin-top:3px}.job-id-large{font-family:"IBM Plex Mono";font-size:10px;color:var(--muted)}
.job-overview{display:grid;grid-template-columns:minmax(0,1.45fr) repeat(3,minmax(155px,.45fr));gap:12px;margin-bottom:14px}
.next-action-card{background:var(--brand);color:#fff;border-radius:11px;padding:17px}.next-label{font-family:"IBM Plex Mono";font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:#CED2E3}.next-value{font-family:"Manrope";font-size:18px;font-weight:700;line-height:1.35;margin-top:8px}.next-owner{font-size:10.5px;color:#E1E4EF;margin-top:7px}
.fact-card{background:#fff;border:1px solid var(--line);border-radius:11px;padding:15px}.fact-label{font-size:10px;color:var(--muted)}.fact-value{font-size:12px;font-weight:700;color:var(--ink);margin-top:7px;line-height:1.4}
.job-tabs{display:flex;gap:3px;border-bottom:1px solid var(--line);overflow-x:auto;margin-bottom:14px}.job-tab{min-width:max-content;border:0;background:transparent;padding:10px 12px 11px;font-size:11px;color:var(--muted);font-weight:600;position:relative}.job-tab.active{color:var(--brand);font-weight:700}.job-tab.active::after{content:"";position:absolute;bottom:-1px;left:10px;right:10px;height:2px;background:var(--brand)}

.timeline{display:flex;flex-direction:column}.timeline-row{display:grid;grid-template-columns:90px 14px 1fr;gap:9px;min-height:48px}.timeline-time{font-family:"IBM Plex Mono";font-size:9px;color:var(--muted);padding-top:3px}.timeline-dot{width:10px;height:10px;border-radius:50%;background:var(--success);margin-top:3px;position:relative}.timeline-row:not(:last-child) .timeline-dot::after{content:"";position:absolute;top:10px;left:4px;width:1px;height:37px;background:var(--line-strong)}.timeline-text{font-size:11px;color:var(--text);line-height:1.45}.timeline-text strong{display:block;color:var(--ink);margin-bottom:2px}

.placeholder{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow)}.placeholder h2{font-size:18px;color:var(--brand);margin:0 0 6px}.placeholder p{font-size:12px;color:var(--muted);line-height:1.55;margin:0}

/* Modal / functional integrity */
.modal-layer{position:fixed;inset:0;background:rgba(28,33,60,.28);z-index:100;display:none;align-items:flex-start;justify-content:center;padding-top:90px}

.modal-body{padding:15px}.modal-search{height:42px;width:100%;border:1px solid var(--line);border-radius:8px;padding:0 11px;font-size:12px;outline:none}.modal-search:focus{border-color:#A2AAC4;box-shadow:0 0 0 3px rgba(45,52,96,.05)}

.mobile-header{display:none}

  .form-grid,.detail-grid-2{grid-template-columns:1fr}.field.full{grid-column:auto}.job-overview{grid-template-columns:1fr}.next-action-card{grid-column:auto}
}

function jobTabContent(j){
  if(state.jobDetailTab==="summary")return `<div class="detail-grid-2"><div class="detail-card"><div class="detail-title">Información general</div>${[["Servicio",j.service],["Producto",j.product],["Ubicación",j.location],["Responsable",j.owner],["Fase",j.phase],["Finanzas",j.finance]].map(r=>`<div class="detail-row"><div>${r[0]}</div><div>${r[1]}</div></div>`).join("")}</div><div class="detail-card"><div class="detail-title">Pendientes</div>${j.pending.length?j.pending.map(p=>`<div class="detail-row"><div>Por resolver</div><div>${p}</div></div>`).join(""):`<div class="empty-note">No hay pendientes abiertos en este Trabajo.</div>`}</div></div>`;
  if(state.jobDetailTab==="operation")return `<div class="detail-card"><div class="detail-title">Progreso operativo</div><div class="timeline">${j.activity.map((a,i)=>`<div class="timeline-row"><div class="timeline-time">${["Hoy","Ayer","Anterior"][i]||"Anterior"}</div><div class="timeline-dot"></div><div class="timeline-text"><strong>${a}</strong>${i===0?"Último movimiento registrado en el expediente.":"Actividad anterior del trabajo."}</div></div>`).join("")}</div></div>`;
  if(state.jobDetailTab==="evidence")return `<div class="detail-grid-2"><div class="detail-card"><div class="detail-title">Evidencias vinculadas</div><div class="fact-value" style="font-size:28px">${j.evidence}</div><div class="page-sub">fotografías / archivos asociados al número de Trabajo</div></div><div class="detail-card"><div class="detail-title">Uso en reportes</div><div class="empty-note">${j.evidence?"Las fotos y los archivos del trabajo sirven de respaldo para sus reportes.":"Todavía no hay evidencias cargadas."}</div></div></div>`;
  if(state.jobDetailTab==="reports")return `<div class="detail-card"><div class="detail-title">Reportes</div>${j.reports.map(r=>`<div class="detail-row"><div>Documento</div><div>${r}</div></div>`).join("")}</div>`;
  if(state.jobDetailTab==="finance")return `<div class="detail-grid-2"><div class="detail-card"><div class="detail-title">Situación financiera</div><div class="detail-row"><div>Estado</div><div>${j.finance}</div></div><div class="detail-row"><div>Origen</div><div>Trabajo ${j.id}</div></div></div><div class="detail-card"><div class="detail-title">Control</div><div class="empty-note">La facturación se habilita cuando el cierre operativo y el detalle de cargos están completos.</div></div></div>`;
  return `<div class="detail-card"><div class="detail-title">Actividad del expediente</div><div class="timeline">${j.activity.map((a,i)=>`<div class="timeline-row"><div class="timeline-time">${["Hoy 09:15","Ayer 16:40","Ayer 11:20"][i]||"Anterior"}</div><div class="timeline-dot"></div><div class="timeline-text"><strong>${a}</strong>Registrado en el historial del Trabajo.</div></div>`).join("")}</div></div>`;
}
function renderJobDetail(){
  const j=getJobs().find(x=>x.id===state.selectedJob)||getJobs()[0];
  document.getElementById("workspace").innerHTML=`<button class="back-btn" onclick="go('jobs')">← Volver a Trabajos</button><div class="job-head"><div><div class="job-id-large">${j.id}</div><div class="job-title">${j.client}</div><div class="page-sub">${j.service} · ${j.product} · ${j.location}</div></div><span class="badge ${badgeTone(j.tone)}">${j.status}</span></div>
    <div class="job-overview"><div class="next-action-card"><div class="next-label">Próxima acción</div><div class="next-value">${j.next}</div><div class="next-owner">Responsable actual: ${j.owner}</div></div><div class="fact-card"><div class="fact-label">Fase</div><div class="fact-value">${j.phase}</div></div><div class="fact-card"><div class="fact-label">Evidencias</div><div class="fact-value">${j.evidence} vinculadas</div></div><div class="fact-card"><div class="fact-label">Finanzas</div><div class="fact-value">${j.finance}</div></div></div>
    <div class="panel"><div class="job-tabs">${[["summary","Resumen"],["operation","Operación"],["evidence","Evidencias"],["reports","Reportes"],["finance","Finanzas"],["activity","Actividad"]].map(t=>`<button class="job-tab ${state.jobDetailTab===t[0]?"active":""}" onclick="setJobTab('${t[0]}')">${t[1]}</button>`).join("")}</div>${jobTabContent(j)}</div>`;
}

/* Placeholder modules */
function renderPlaceholder(){
  document.getElementById("workspace").innerHTML=`<div class="page-head"><div><div class="smallcaps">Demostración</div><h1>${state.placeholderName}</h1><div class="page-sub">Esta sección todavía no está disponible en la demo.</div></div></div><div class="placeholder"><h2>Pendiente de definir</h2><p>Antes de desarrollarla, falta confirmar con el equipo cómo se realiza este trabajo y quién es responsable.</p></div>`;

/* Search and notifications */
function openSearch(){
  const html=`<div class="modal-head"><div class="modal-title">Buscar en Fides Control</div><button class="modal-close" onclick="closeModal()">×</button></div><div class="modal-body"><input id="globalSearch" class="modal-search" placeholder="Trabajo, cliente, servicio..." oninput="renderSearchResults(this.value)" autofocus><div id="searchResults" class="search-results"></div></div>`;
  openModal(html);setTimeout(()=>renderSearchResults(""),0)
}
function renderSearchResults(q){
  const target=document.getElementById("searchResults");if(!target)return;
  const s=(q||"").toLowerCase();const jobs=getJobs().filter(j=>!s||[j.id,j.client,j.service,j.product].join(" ").toLowerCase().includes(s)).slice(0,6);
  target.innerHTML=jobs.length?jobs.map(j=>`<div class="search-result" onclick="closeModal();openJob('${j.id}')"><div class="search-result-icon">${ico("briefcase")}</div><div><div class="search-result-title">${j.id} · ${j.client}</div><div class="search-result-sub">${j.service} · ${j.status}</div></div><span>›</span></div>`).join(""):`<div class="empty-note">No se encontraron trabajos con esos datos.</div>`;
}
function openNotifications(){
  openModal(`<div class="modal-head"><div class="modal-title">Notificaciones</div><button class="modal-close" onclick="closeModal()">×</button></div><div class="modal-body"><div class="notification"><div class="notif-dot"></div><div><div class="notif-title">2026-0128 · Laboratorio pendiente</div><div class="notif-copy">El reporte final sigue bloqueado hasta recibir el resultado.</div></div><button class="notif-action" onclick="closeModal();openJob('2026-0128')">Abrir</button></div><div class="notification"><div class="notif-dot" style="background:var(--warning)"></div><div><div class="notif-title">2026-0123 · Terminado sin facturar</div><div class="notif-copy">Falta completar el detalle de facturación.</div></div><button class="notif-action" onclick="closeModal();openJob('2026-0123')">Abrir</button></div><div class="notification"><div class="notif-dot" style="background:var(--info)"></div><div><div class="notif-title">Q-2026-0047 · Cotización</div><div class="notif-copy">La propuesta está disponible para revisión y envío.</div></div><button class="notif-action" onclick="closeModal();go('quotes');state.quoteStep=3;state.quoteMaxStep=Math.max(state.quoteMaxStep,3);render()">Abrir</button></div></div>`);
}
function openModal(content){document.getElementById("modalContent").innerHTML=content;document.getElementById("modalLayer").classList.add("open")}
function closeModal(){document.getElementById("modalLayer").classList.remove("open")}
function modalBackdrop(e){if(e.target===document.getElementById("modalLayer"))closeModal()}

/* Quote actions */
function setQ(k,v){state.quote[k]=v}
function updateLine(id,k,v){const l=state.quote.lines.find(x=>x.id===id);if(!l)return;l[k]=["qty","rate","markup"].includes(k)?Number(v||0):v;const el=document.getElementById(`lt-${id}`);if(el)el.textContent=`USD ${fmtMoney(lineTotal(l))}`;const t=document.getElementById("quoteTotal");if(t)t.textContent=`USD ${fmtMoney(quoteTotal())}`}
function addRateLine(){const id=Math.max(...state.quote.lines.map(x=>x.id),0)+1;state.quote.lines.push({id,concept:"Nuevo concepto",basis:"servicio",qty:1,rate:0,markup:0});render()}
function removeRateLine(id){if(state.quote.lines.length===1){toast("La cotización debe tener al menos un concepto.");return}state.quote.lines=state.quote.lines.filter(x=>x.id!==id);render()}
function advanceQuote(n){state.quoteStep=n;state.quoteMaxStep=Math.max(state.quoteMaxStep,n);state.shareOpen=false;render();window.scrollTo({top:0,behavior:"smooth"})}
function goQuoteStep(n){if(n<=state.quoteMaxStep){state.quoteStep=n;state.shareOpen=false;render();window.scrollTo({top:0,behavior:"smooth"})}}
function toggleShare(){state.shareOpen=!state.shareOpen;render()}
function markSent(channel){state.quoteSent=true;state.shareOpen=false;render();toast(`Propuesta registrada como enviada por ${channel}.`)}
function proposalText(){return [`Cotización Q-2026-0047 - ${state.quote.client}`,`${state.quote.service} | ${state.quote.product} | ${state.quote.quantity}`,`Ubicación: ${state.quote.location}`,`Total: USD ${fmtMoney(quoteTotal())}`,``,state.quote.terms].join("\n")}
function sendEmail(){markSent("correo");setTimeout(()=>window.open(`mailto:?subject=${encodeURIComponent("Cotización Q-2026-0047 - "+state.quote.client)}&body=${encodeURIComponent(proposalText())}`,"_blank"),50)}
function sendWhatsApp(){markSent("WhatsApp");setTimeout(()=>window.open(`https://wa.me/?text=${encodeURIComponent(proposalText())}`,"_blank"),50)}
async function shareProposal(){markSent("compartir");if(navigator.share){try{await navigator.share({title:"Q-2026-0047",text:proposalText()});return}catch(e){}}try{await navigator.clipboard.writeText(proposalText());toast("Propuesta copiada para compartir.")}catch(e){}}
function acceptQuote(){state.quoteAccepted=true;render();toast("Aceptación registrada.")}
function convertQuote(){state.quoteAccepted=true;state.quoteWorkCreated=true;state.quoteStep=4;state.quoteMaxStep=4;state.selectedJob="2026-0134";render();toast("Trabajo 2026-0134 creado.")}

/* Navigation */
function render(){
  if(state.view==="home")renderHome();
  else if(state.view==="quotes")renderQuotes();
  else if(state.view==="jobs")renderJobs();
  else if(state.view==="jobDetail")renderJobDetail();
  else renderPlaceholder();
  document.querySelectorAll(".nav-btn").forEach(b=>b.classList.toggle("active",b.dataset.key===state.navKey));
  document.getElementById("sidebar").classList.remove("open")
}
function go(v){state.view=v;state.navKey=v;render();window.scrollTo({top:0,behavior:"smooth"})}
function goPlaceholder(name,key){state.placeholderName=name;state.view="placeholder";state.navKey=key;render();window.scrollTo({top:0,behavior:"smooth"})}
function openJob(id){state.selectedJob=id;state.jobDetailTab="summary";state.view="jobDetail";state.navKey="jobs";render();window.scrollTo({top:0,behavior:"smooth"})}
function setJobTab(t){state.jobDetailTab=t;render()}
function setJobFilter(f){state.jobFilter=f;render()}
function showAttentionJobs(){state.jobFilter="attention";go("jobs")}
function toggleMenu(){document.getElementById("sidebar").classList.toggle("open")}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1700)}
render();
</script>
<script>/* Commercial Workspace V2 — synthetic discovery model */
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=v=>JSON.parse(JSON.stringify(v));
const modes=['Contrato','Cotización aprobada','Spot','Renovación','Carga manual'];
const tabs=['Solicitud','Cliente y acuerdo','Tarifas','Propuesta','Historial'];
const seed=clone(state.quote);
function newCase(n,client,service,qty,location){let q=clone(seed);Object.assign(q,{client,service,quantity:qty,location,date:'2026-09-28',contact:n===0?'María González':'Contacto de ejemplo',email:n===0?'maria@example.com':'compras@example.com'});if(n)q.lines=[{id:1,concept:service,basis:'operacion',qty:1,rate:380,markup:0}];return {id:'Q-2026-00'+(47+n),q,status:'Borrador',revision:1,requestReviewed:false,agreementReviewed:false,priceReviewed:false,agreement:{id:'AC-DEMO-0'+(47+n),mode:n===1?'Spot':'Contrato',clientType:n===1?'Cliente nuevo':'Cliente registrado',ref:'',start:'2026-09-01',end:'2026-12-31',terms:q.terms,currency:'USD',source:'Carga manual pendiente de revisión'},tariff:[],events:[{at:'10 sep 2026 · 10:24',text:'Solicitud de ejemplo recibida'}],doc:'',extracted:false,job:null,archive:[]};}
let cw={selected:0,tab:'Solicitud',filter:'Todas',cases:[newCase(0,'Paraná Grains','Inspección + muestreo','5.000 MT','Puerto Industrial Villeta'),newCase(1,'Agroexport Demo','Control de carga','2.500 MT','San Antonio'),newCase(2,'Campo Este Demo','Inspección en planta','1.200 MT','Villeta')]};
let storageOK=true;try{const saved=JSON.parse(localStorage.getItem('fides-commercial-v2'));if(saved?.schema===2)cw=saved.data}catch(e){storageOK=false}
function C(){return cw.cases[cw.selected]}
function log(text){C().events.unshift({at:new Date().toLocaleString('es-PY'),text})}
function save(){try{localStorage.setItem('fides-commercial-v2',JSON.stringify({schema:2,data:cw}))}catch(e){storageOK=false}state.quote=C().q}
function locked(){return C().status!=='Borrador'}
function change(k,v){if(locked())return;C().q[k]=v;C().requestReviewed=false;if(['client','date'].includes(k))C().agreementReviewed=false;if(['service','product','quantity','location'].includes(k))C().priceReviewed=false;log('Dato corregido: '+({client:'Cliente',contact:'Contacto',email:'Correo',service:'Servicio',product:'Producto',quantity:'Cantidad',location:'Ubicación',date:'Fecha',notes:'Observaciones'}[k]||k));save();contextRefresh()}
function agreementChange(k,v){if(locked())return;C().agreement[k]=v;C().agreementReviewed=false;save();contextRefresh()}
function contextRefresh(){const e=document.getElementById('cw-context');if(e)e.innerHTML=contextPanel();const r=document.querySelector('[onclick="reviewRequest()"]');if(r){r.disabled=locked()||C().requestReviewed;r.textContent=C().requestReviewed?'Alcance confirmado':'Confirmar alcance'}const a=document.getElementById('agreement-check');if(a)a.checked=C().agreementReviewed;const p=document.getElementById('price-check');if(p)p.checked=C().priceReviewed}
function selectCase(i){cw.selected=i;save();render()}
function selectTab(t){cw.tab=t;save();render()}
function btn(label,action,primary=false,disabled=false){return `<button class="${primary?'primary-btn':'secondary-btn'}" onclick="${action}" ${disabled?'disabled':''}>${label}</button>`}
function field(label,key,value,handler='change',type='text'){return `<label class="cw-field">${label}<input type="${type}" value="${esc(value)}" onchange="${handler}('${key}',this.value)" ${locked()?'disabled':''}></label>`}
function selectField(label,key,value,options){return `<label class="cw-field">${label}<select onchange="agreementChange('${key}',this.value)" ${locked()?'disabled':''}>${options.map(s=>`<option ${value===s?'selected':''}>${s}</option>`).join('')}</select></label>`}
function validAgreement(){let a=C().agreement,q=C().q;return !!q.client.trim()&&!!a.ref.trim()&&!!a.terms.trim()&&!!a.start&&!!a.end&&a.start<=q.date&&a.end>=q.date&&a.end>=a.start}
function pending(){let c=C(),p=[];if(!c.requestReviewed)p.push('Valider le besoin');if(!c.agreementReviewed||!validAgreement())p.push('Revisar acuerdo comercial');if(!c.priceReviewed||!validRates())p.push('Revisar tarifas y cantidades');return p.map(x=>x==='Valider le besoin'?'Confirmar alcance y fecha':x)}
function contextPanel(){let c=C(),p=pending();return `<div class="smallcaps">Estado de la cotización</div><h3>${esc(c.status)}</h3><span class="badge ${c.status==='Borrador'?'warning':'success'}">${c.id} · r${c.revision}</span><hr><strong>Pendientes</strong>${p.length?`<ul>${p.map(x=>`<li>${x}</li>`).join('')}</ul>`:`<p>Sin revisiones pendientes.</p>`}<hr><strong>Acuerdo ${c.agreementReviewed?'revisado':'por confirmar'}</strong><p>${esc(c.agreement.mode)} · ${esc(c.agreement.ref||'Sin referencia')}<br>${esc(c.agreement.source)}</p><span class="badge ${c.agreementReviewed?'success':'warning'}">${c.agreementReviewed?'Revisado':'No validado'}</span><hr><strong>Sugerencias</strong><p>${c.q.location.includes('Villeta')?'Comparar muestreo en Villeta con operaciones anteriores.':'Revisar desplazamiento y disponibilidad para esta ubicación.'}</p><p class="cw-muted">Ejemplos ficticios para comparar tarifas.</p>${btn('Consultar referencias',"selectTab('Tarifas')")}<hr><div class="cw-muted">Demostración con datos ficticios.<br>${storageOK?'Cambios guardados en este navegador.':'No se pudieron guardar los cambios. Mantené esta pestaña abierta.'}</div>`}
function renderQuotes(){state.quote=C().q;let c=C();document.getElementById('workspace').innerHTML=`<div class="page-head"><div><div class="smallcaps">Gestión comercial</div><h1>Cotización inteligente</h1><div class="page-sub">Revisá la solicitud y las condiciones antes de enviar la propuesta.</div></div><span class="badge navy">Demo · datos ficticios</span></div><div class="cw-layout"><aside class="cw-inbox"><div class="cw-inbox-head"><h3>Solicitudes</h3><label class="cw-field">Mostrar<select onchange="cw.filter=this.value;save();render()">${['Todas','Pendientes','Con trabajo'].map(x=>`<option ${cw.filter===x?'selected':''}>${x}</option>`).join('')}</select></label></div>${cw.cases.map((x,i)=>({x,i})).filter(({x})=>cw.filter==='Todas'||(cw.filter==='Con trabajo'?x.job:!x.job)).map(({x,i})=>`<button class="cw-request ${i===cw.selected?'active':''}" onclick="selectCase(${i})"><span class="smallcaps">${x.id}</span><strong>${esc(x.q.client)}</strong><span>${esc(x.q.service)}</span><span>${esc(x.q.quantity)} · ${esc(x.q.location)}</span><span class="cw-status">${esc(x.status)}</span></button>`).join('')||'<p class="cw-pad">No hay solicitudes en esta vista.</p>'}</aside><section class="cw-center"><div class="cw-heading"><div><h2>${esc(c.q.client)}</h2><p>${esc(c.q.service)} · ${esc(c.q.quantity)}</p></div><span class="badge navy">${c.id}</span></div><nav class="cw-tabs" aria-label="Secciones comerciales">${tabs.map(t=>`<button class="${cw.tab===t?'active':''}" aria-current="${cw.tab===t?'page':'false'}" onclick="selectTab('${t}')">${t}</button>`).join('')}</nav><div class="cw-body">${cw.tab==='Solicitud'?requestView():cw.tab==='Cliente y acuerdo'?agreementView():cw.tab==='Tarifas'?ratesView():cw.tab==='Propuesta'?proposalView():historyView()}</div></section><aside class="cw-context" id="cw-context">${contextPanel()}</aside></div>`}
function requestView(){let c=C();return `<h3>Solicitud recibida</h3><div class="cw-message">Hola Hernán,<br><br>Solicitamos cotizar ${esc(c.q.service.toLowerCase())} para ${esc(c.q.quantity)} de ${esc(c.q.product.toLowerCase())} en ${esc(c.q.location)}. Fecha prevista: ${esc(c.q.date)}.<br><br>${esc(c.q.contact)}<br><span class="cw-muted">Mensaje de ejemplo; no corresponde a un cliente real.</span></div><h3>Alcance a confirmar</h3><div class="cw-form">${[['Servicio','service'],['Producto','product'],['Cantidad solicitada','quantity'],['Ubicación','location'],['Fecha del servicio','date']].map(([l,k])=>field(l,k,c.q[k],'change',k==='date'?'date':'text')).join('')}<label class="cw-field full">Observaciones<textarea onchange="change('notes',this.value)" ${locked()?'disabled':''}>${esc(c.q.notes)}</textarea></label></div><div class="cw-actions">${btn(c.requestReviewed?'Alcance confirmado':'Confirmar alcance',"reviewRequest()",true,locked()||c.requestReviewed)}${btn('Cliente y acuerdo →',"selectTab('Cliente y acuerdo')")}</div>`}
function reviewRequest(){if(locked())return;let q=C().q;if(['service','product','quantity','location','date'].some(k=>!q[k].trim()))return toast('Completá servicio, producto, cantidad, ubicación y fecha.');C().requestReviewed=true;log('Alcance y fecha confirmados por Hernán · demo');save();render()}
function agreementView(){let c=C(),a=c.agreement;return `<h3>Datos del cliente</h3><div class="cw-form">${field('Cliente','client',c.q.client)}${field('Contacto','contact',c.q.contact)}${field('Correo de contacto','email',c.q.email,'change','email')}${selectField('Relación','clientType',a.clientType,['Cliente registrado','Cliente nuevo'])}${selectField('Modalidad del acuerdo','mode',a.mode,modes)}${field('Referencia comercial','ref',a.ref,'agreementChange')}${field('Vigente desde','start',a.start,'agreementChange','date')}${field('Vigente hasta','end',a.end,'agreementChange','date')}</div><h3>Documento de origen</h3><p class="cw-muted">Cargá el ejemplo, abrí un archivo TXT o pegá el texto de un documento con el mismo formato. Revisá los datos encontrados antes de usarlos. Esta demo no lee PDF ni imágenes.</p><div class="cw-actions">${btn('Cargar documento de ejemplo',"loadExample()",false,locked())}<label class="secondary-btn cw-file">Abrir TXT<input aria-label="Abrir documento TXT" type="file" accept=".txt,text/plain" onchange="readTextFile(this)" ${locked()?'disabled':''}></label></div><label class="cw-field">Texto del documento<textarea class="cw-source" onchange="if(locked())return;C().doc=this.value;C().extracted=false;C().agreementReviewed=false;save();render()" ${locked()?'disabled':''}>${esc(c.doc)}</textarea></label><div class="cw-actions">${btn('Leer documento',"extractDocument()",true,locked()||!c.doc.trim())}</div>${c.extracted?extractionView():''}<h3>Condiciones comerciales</h3><label class="cw-field">Pago, validez de la propuesta y exclusiones<textarea onchange="agreementChange('terms',this.value)" ${locked()?'disabled':''}>${esc(a.terms)}</textarea></label><p class="cw-muted">Importes en USD, antes de impuestos. Los impuestos aún no están definidos en esta demo.</p><label class="cw-check"><input id="agreement-check" type="checkbox" ${c.agreementReviewed?'checked':''} ${locked()?'disabled':''} onchange="reviewAgreement(this.checked)"> Revisé el cliente, el acuerdo, su vigencia y las condiciones.</label>${btn('Ir a tarifas →',"selectTab('Tarifas')")}`}
function loadExample(){if(locked())return;C().doc=`DOCUMENTO DE EJEMPLO · Sin validez comercial\nCliente: ${C().q.client}\nModalidad: ${C().agreement.mode}\nReferencia: DEMO-AC-2026-047\nDesde: 2026-09-01\nHasta: 2026-12-31\nCondiciones: Pago a 30 días de factura. Propuesta válida por 7 días. Viáticos y terceros se cotizan por separado.\nTarifa: Inspección | servicio | 450\nTarifa: Muestreo | tonelada | 0.08\nTarifa: Horas extra | hora | 45`;C().extracted=false;C().agreementReviewed=false;log('Documento de ejemplo cargado');save();render()}
async function readTextFile(input){if(locked())return;let f=input.files[0];if(!f)return;if(f.size>200000)return toast('Usá un TXT de hasta 200 KB.');C().doc=await f.text();C().extracted=false;C().agreementReviewed=false;log('Documento cargado: '+f.name);save();render()}
function extractDocument(){if(locked())return;let c=C(),get=k=>(c.doc.match(new RegExp('^'+k+':\\s*(.+)$','mi'))||[])[1]||'';c.extraction={client:get('Cliente'),mode:get('Modalidad'),ref:get('Referencia'),start:get('Desde'),end:get('Hasta'),terms:get('Condiciones'),tariff:c.doc.split('\n').filter(x=>/^Tarifa:/i.test(x)).map(x=>{let [concept,basis,rate]=x.replace(/^Tarifa:\s*/i,'').split('|').map(x=>x.trim());return {concept,basis,rate:Number(rate),source:x}}).filter(x=>x.concept&&pricingBases.some(b=>b[0]===x.basis)&&Number.isFinite(x.rate)&&x.rate>=0)};c.extracted=true;c.agreementReviewed=false;log('Documento leído; datos pendientes de revisión');save();render()}
function extractionView(){let e=C().extraction;return `<div class="cw-extraction"><h3>Datos encontrados</h3><p>Revisá estos datos contra el documento. Los datos que no aparecen quedan sin completar.</p>${Object.entries(e).filter(([k])=>k!=='tariff').map(([k,v])=>`<div class="detail-row"><div>${({client:'Cliente',mode:'Modalidad',ref:'Referencia',start:'Desde',end:'Hasta',terms:'Condiciones'})[k]}</div><div>${esc(v||'No encontrado')}</div></div>`).join('')}<p>${e.tariff.length} tarifas encontradas: ${e.tariff.map(x=>`${esc(x.concept)} · USD ${fmtMoney(x.rate)}/${esc(x.basis)}`).join('; ')||'ninguna'}.</p>${btn('Confirmar datos y usar en el borrador',"applyExtraction()",true,locked())}</div>`}
function applyExtraction(){if(locked())return;let c=C(),e=c.extraction;if(!e)return;if(e.client&&e.client!==c.q.client)return toast('El cliente del documento no coincide. Corregí el cliente o el texto del documento.');for(let k of ['ref','start','end','terms'])if(e[k])c.agreement[k]=e[k];if(modes.includes(e.mode))c.agreement.mode=e.mode;c.agreement.source='Texto del documento revisado · '+(e.ref||'sin referencia');c.tariff=clone(e.tariff);c.agreementReviewed=false;c.extracted=false;log('Datos del documento incorporados al borrador. Falta revisar el acuerdo.');save();render()}
function reviewAgreement(value){let c=C(),a=c.agreement;if(locked())return;if(value&&(!c.q.client.trim()||!a.ref.trim()||!a.terms.trim()||!a.start||!a.end||a.end<a.start||c.q.date<a.start||c.q.date>a.end)){toast('Completá la referencia y las condiciones. La vigencia del acuerdo debe incluir la fecha del servicio.');render();return}c.agreementReviewed=value;if(value&&a.source==='Carga manual pendiente de revisión')a.source='Carga manual revisada por Hernán · demo';log(value?'Acuerdo comercial revisado por Hernán · demo':'Acuerdo pendiente de nueva revisión');save();render()}
function rateEdit(i,k,v){if(locked())return;let l=C().q.lines[i];l[k]=['qty','rate','markup'].includes(k)?(v===''?null:Number(v)):v;C().priceReviewed=false;log('Concepto '+(i+1)+' corregido: '+({concept:'Descripción',basis:'Base de cobro',qty:'Cantidad',rate:'Tarifa',markup:'Markup'}[k]||k));save();document.getElementById('sum-'+i).textContent='USD '+fmtMoney(lineTotal(l));document.getElementById('cw-total').textContent='USD '+fmtMoney(quoteTotal());let ck=document.getElementById('price-check');if(ck)ck.checked=false;contextRefresh()}
function validRates(){return C().q.lines.length>0&&C().q.lines.every(l=>l.concept.trim()&&['qty','rate','markup'].every(k=>typeof l[k]==='number'&&Number.isFinite(l[k])&&l[k]>=0)&&l.qty>0)&&Number.isFinite(quoteTotal())&&quoteTotal()>0}
function ratesView(){let c=C();return `<h3>Tarifas de la propuesta</h3><p class="cw-muted">Indicá cómo se cobra cada servicio, la cantidad y la tarifa. El markup es el porcentaje que se agrega al costo.</p>${c.tariff.length?`<div class="cw-extraction"><strong>Tarifas del acuerdo ${esc(c.agreement.ref)}</strong>${c.tariff.map((t,i)=>`<div class="cw-tariff"><span>${esc(t.concept)}<small>USD ${fmtMoney(t.rate)} / ${esc(pricingLabel(t.basis))}${t.markup?` · ${t.markup}% markup`:""}</small></span>${btn('Usar tarifa',`useTariff(${i})`,false,locked()||!c.agreementReviewed)}</div>`).join('')}<p class="cw-muted">Revisá el acuerdo antes de usar sus tarifas. Si el concepto ya existe en la propuesta, se actualiza; si no, se agrega.</p></div>`:''}<div class="cw-actions">${btn('+ Agregar concepto',"addCommercialLine()",false,locked())}${btn('Guardar como tarifario del acuerdo',"saveManualTariff()",false,locked())}</div>${c.q.lines.map((l,i)=>`<div class="cw-rate"><div class="cw-rate-head"><label class="cw-field">Concepto<input aria-label="Concepto ${i+1}" value="${esc(l.concept)}" onchange="rateEdit(${i},'concept',this.value)" ${locked()?'disabled':''}></label>${btn('Quitar',`removeCommercialLine(${i})`,false,locked())}</div><div class="cw-rate-grid"><label class="cw-field">Base<select aria-label="Base ${i+1}" onchange="rateEdit(${i},'basis',this.value)" ${locked()?'disabled':''}>${pricingBases.map(([k,v])=>`<option value="${k}" ${l.basis===k?'selected':''}>${v}</option>`).join('')}</select></label>${[['Cantidad','qty'],['Tarifa USD','rate'],['Markup %','markup']].map(([label,k])=>`<label class="cw-field">${label}<input aria-label="${label} ${i+1}" type="number" min="0" step="any" value="${l[k]??''}" onchange="rateEdit(${i},'${k}',this.value)" ${locked()?'disabled':''}></label>`).join('')}</div><div class="cw-rate-foot"><span class="cw-muted">${esc(l.source||'Carga manual · pendiente de revisión')}</span><strong id="sum-${i}">USD ${fmtMoney(lineTotal(l))}</strong></div></div>`).join('')}<div class="pricing-total"><span>Total antes de impuestos</span><strong id="cw-total">USD ${fmtMoney(quoteTotal())}</strong></div><label class="cw-check"><input id="price-check" type="checkbox" ${c.priceReviewed?'checked':''} ${locked()?'disabled':''} onchange="reviewPrices(this.checked)"> Revisé bases, cantidades, tarifas y markup.</label><h3>Referencias para comparar</h3><div class="cw-extraction"><strong>${c.q.location.includes('Villeta')?'Muestreo · Villeta':'Control de carga · San Antonio'}</strong><p>${c.q.location.includes('Villeta')?'Tres operaciones ficticias de soja, 3.000–6.000 MT, agosto 2026: USD 0,075 / 0,080 / 0,085 por tonelada. Mediana: USD 0,080.':'Dos operaciones ficticias, agosto 2026: USD 360 y USD 400 por operación. Referencia media: USD 380.'}</p><p class="cw-muted">Verificá que el alcance sea comparable. Estos ejemplos no incluyen impuestos ni confirman disponibilidad. Revisá el acuerdo vigente antes de usar la tarifa.</p>${btn('Usar tarifa de referencia',"applySuggestion()",false,locked())}</div>${btn('Revisar propuesta →',"selectTab('Propuesta')",true)}`}
function addCommercialLine(){if(locked())return;C().q.lines.push({id:Date.now(),concept:'Nuevo concepto',basis:'servicio',qty:1,rate:0,markup:0});C().priceReviewed=false;save();render()}
function removeCommercialLine(i){if(locked())return;log('Concepto eliminado: '+C().q.lines[i].concept);C().q.lines.splice(i,1);C().priceReviewed=false;save();render()}
function useTariff(i){if(locked()||!C().agreementReviewed)return;let t=C().tariff[i],l=C().q.lines.find(l=>l.concept.toLowerCase()===t.concept.toLowerCase());if(l){Object.assign(l,{basis:t.basis,rate:t.rate,markup:t.markup||0,source:C().agreement.id+' · '+C().agreement.ref})}else C().q.lines.push({id:Date.now(),concept:t.concept,basis:t.basis,qty:1,rate:t.rate,markup:t.markup||0,source:C().agreement.id+' · '+C().agreement.ref});C().priceReviewed=false;log('Tarifa aplicada desde acuerdo: '+t.concept);save();render()}
function applySuggestion(){if(locked())return;let vil=C().q.location.includes('Villeta'),concept=vil?'Muestreo':'Control de carga',l=C().q.lines.find(x=>x.concept===concept),data={concept,basis:vil?'tonelada':'operacion',rate:vil?.08:380,source:'Tarifa de ejemplo elegida por Hernán'};if(l)Object.assign(l,data);else C().q.lines.push({...data,id:Date.now(),qty:1,markup:0});C().priceReviewed=false;log('Tarifa de referencia incorporada al borrador. Falta revisar el precio.');save();render()}
function reviewPrices(v){if(locked())return;if(v&&!validRates()){toast('Completá cada concepto. Usá cantidades mayores a cero y tarifas y markup de cero o más. El total debe ser mayor a cero.');render();return}C().priceReviewed=v;log(v?'Tarifas y cantidades revisadas por Hernán · demo':'Tarifas pendientes de nueva revisión');save();render()}
function commercialPaper(q=C().q,a=C().agreement){return `<div class="cw-paper"><div class="smallcaps">${C().id} · Versión ${C().revision} · ${esc(C().status)}</div><h2>${esc(q.client)}</h2><p>${esc(q.service)}<br>${esc(q.product)} · ${esc(q.quantity)} · ${esc(q.location)}<br>Fecha: ${esc(q.date)} · ${esc(q.contact)}</p><div class="cw-table-scroll"><table class="proposal-table"><thead><tr><th>Concepto / base</th><th>Cant.</th><th>USD</th><th>Markup</th><th>Total USD</th></tr></thead><tbody>${q.lines.map(l=>`<tr><td>${esc(l.concept)}<small>${esc(pricingLabel(l.basis))}</small></td><td>${l.qty??'—'}</td><td>${fmtMoney(l.rate)}</td><td>${l.markup??'—'}%</td><td>${fmtMoney(lineTotal(l))}</td></tr>`).join('')}</tbody></table></div><div class="pricing-total"><span>Total antes de impuestos</span><strong>USD ${fmtMoney(q.lines.reduce((s,l)=>s+lineTotal(l),0))}</strong></div><h3>Acuerdo ${esc(a.ref||'pendiente')}</h3><p>${esc(a.mode)} · ${esc(a.id)}<br>Vigencia: ${esc(a.start)} a ${esc(a.end)}</p><p class="cw-preserve">${esc(a.terms)}</p><h3>Alcance y observaciones</h3><p class="cw-preserve">${esc(q.notes)}</p><p class="cw-muted">Documento de ejemplo · sin validez comercial.</p></div>`}
function proposalView(){let c=C();return `${commercialPaper()}<div class="cw-actions">${btn('Imprimir / guardar PDF',"printCommercial()")}${c.status==='Borrador'?btn('Revisar envío',"sendDialog()",true,pending().length>0):c.status==='Enviada'?btn('Registrar aceptación',"acceptDialog()",true):c.status==='Aceptada'?btn('Crear Trabajo',"createCommercialJob()",true):btn('Abrir Trabajo '+c.job.id,`openJob('${c.job.id}')`,true)}${c.status==='Enviada'||c.status==='Aceptada'?btn('Crear nueva versión',"reviseCommercial()") :''}</div>${pending().length?'<div class="cw-notice">Para enviar, falta confirmar las revisiones indicadas en Pendientes.</div>':''}${locked()?'<p class="cw-muted">Esta versión ya no se puede editar. El envío y la aceptación son simulados.</p>':''}`}

const originalGetJobs=getJobs;getJobs=function(){return [...cw.cases.filter(c=>c.job).map(c=>{let j=c.job,q=j.snapshot.q;return {id:j.id,client:esc(q.client),phase:j.closed?'Cierre operativo':'Nominación',status:j.invoice?'Facturado':j.closed?'Listo para facturar':'Nuevo',tone:'navy',next:j.invoice?'Dar seguimiento al cobro':j.closed?'Revisar cargos y facturar':'Confirmar coordinación operativa',owner:'Lucía Ferreira',service:esc(q.service),location:esc(q.location),product:esc(q.product),evidence:0,finance:j.invoice?'Factura '+j.invoice.id:j.closed?'Cargos por revisar':'Pendiente de cierre operativo',pending:j.closed?[]:['Ejecución y cierre operativo'],reports:[],activity:c.events.map(e=>esc(e.text)),commercial:j}}),...originalGetJobs()]};

function billingCard(c){let j=c.job,s=j.snapshot,total=s.q.lines.reduce((a,l)=>a+lineTotal(l),0);return `<div class="detail-card"><h3>${j.invoice?'Factura de demostración '+j.invoice.id:'Detalle para facturación'}</h3><p>Trabajo ${j.id} · ${c.id} r${s.revision}<br>Acuerdo ${esc(s.agreement.ref)} · ${esc(s.agreement.mode)}</p><p class="cw-preserve">${esc(s.agreement.terms)}</p><div class="cw-table-scroll"><table class="proposal-table"><thead><tr><th>Cargo aprobado</th><th>Cantidad</th><th>Total USD</th></tr></thead><tbody>${s.q.lines.map(l=>`<tr><td>${esc(l.concept)} · ${esc(pricingLabel(l.basis))}</td><td>${l.qty}</td><td>${fmtMoney(lineTotal(l))}</td></tr>`).join('')}</tbody></table></div><div class="pricing-total"><span>Base antes de impuestos</span><strong>USD ${fmtMoney(total)}</strong></div><p class="cw-muted">En este ejemplo, las cantidades realizadas coinciden con las aprobadas. La factura no incluye impuestos ni tiene validez fiscal.</p>${!j.closed?'<div class="cw-notice">Falta el cierre operativo. Abrí Operación para simularlo.</div>':!j.invoice?`<label class="cw-check"><input type="checkbox" ${j.billReviewed?'checked':''} onchange="reviewBill('${j.id}',this.checked)"> Revisé cargos ejecutados y acuerdo aprobado.</label>${btn('Generar factura demo',`invoiceJob('${j.id}')`,true,!j.billReviewed)}`:`<span class="badge success">Factura de ejemplo generada · sin validez fiscal</span>`}</div>`}

const v3Tabs=['Solicitud','Preparación','Propuesta'];
let v3DocumentOpen=false;
function v3Tab(t){return ['Cliente y acuerdo','Tarifas'].includes(t)?'Preparación':v3Tabs.includes(t)?t:'Solicitud'}
selectTab=function(t){if(t==='Historial'){v3History();return}cw.tab=v3Tab(t);save();render()};
function v3Ready(){return C().requestReviewed&&C().agreementReviewed&&C().priceReviewed&&validAgreement()&&validRates()}
function v3Pending(){let c=C(),p=[];if(!c.requestReviewed)p.push('Confirmar servicio, cantidad y fecha');if(!c.agreement.ref.trim())p.push('Completar referencia del acuerdo');if(!validAgreement())p.push('Revisar condiciones y vigencia');else if(!c.agreementReviewed)p.push('Confirmar acuerdo comercial');if(!validRates())p.push('Corregir cantidades o tarifas');else if(!c.priceReviewed)p.push('Confirmar precio');return p}
contextPanel=function(){let c=C(),a=c.agreement,p=v3Pending(),valid=validAgreement();return `<div class="smallcaps">Estado</div><h3>${esc(c.status)}</h3><p>${c.id} · Versión ${c.revision}</p><hr><strong>Falta revisar</strong>${p.length?`<ul>${p.map(x=>`<li>${x}</li>`).join('')}</ul>`:'<p>Sin revisiones pendientes.</p>'}<hr><strong>Acuerdo aplicable</strong><p>${esc(a.mode)}<br>${esc(a.ref||'Sin referencia')}<br>${esc(a.start)} a ${esc(a.end)}</p><span class="badge ${c.agreementReviewed&&valid?'success':'warning'}">${c.agreementReviewed&&valid?'Revisado':'Por confirmar'}</span>${!valid?'<div class="v3-alert">La referencia, las condiciones y la vigencia deben estar completas. La vigencia debe incluir la fecha del servicio.</div>':''}${!storageOK?'<div class="v3-alert">No se pudieron guardar los cambios. Mantené esta pestaña abierta.</div>':''}<hr><strong>A tener en cuenta</strong><p>${c.q.location.includes('Villeta')?'Hay referencias de muestreo en Villeta para comparar con el precio.':'Revisá viáticos y disponibilidad para esta ubicación.'}</p><p class="cw-muted">Referencias ficticias. No sustituyen el acuerdo con el cliente.</p>`};
function v3Primary(){let c=C();if(cw.tab==='Solicitud')return btn('Revisar cotización',"v3Prepare()",true);if(cw.tab==='Preparación')return btn('Ver propuesta',"selectTab('Propuesta')",true,!v3Ready());if(c.status==='Borrador')return btn('Enviar propuesta',"sendDialog()",true,!v3Ready());if(c.status==='Enviada')return btn('Registrar aceptación',"acceptDialog()",true);if(c.status==='Aceptada')return btn('Crear trabajo',"createCommercialJob()",true);return btn('Abrir trabajo',`openJob('${c.job.id}')`,true)}
function v3Menu(){let c=C();return `<details class="v3-menu"><summary aria-label="Más opciones">•••</summary><div class="v3-menu-items">${btn('Historial',"v3History()")}${btn(c.doc?'Ver documento de origen':'Cargar documento',"v3Document()")}${cw.tab==='Preparación'&&!locked()?`${btn('Agregar concepto',"addCommercialLine()")}${btn('Quitar concepto',"v3RemoveDialog()",false,!c.q.lines.length)}${btn('Consultar tarifario',"v3Tariffs()")}${btn('Comparar tarifas',"v3References()")}${btn('Guardar como tarifario',"v3SaveTariff()")}`:''}${['Enviada','Aceptada'].includes(c.status)?btn('Crear nueva versión',"v3RevisionDialog()"):''}</div></details>`}
renderQuotes=function(){cw.tab=v3Tab(cw.tab);state.quote=C().q;let c=C();document.getElementById('workspace').innerHTML=`<div class="v3-quotes"><div class="page-head"><div><div class="smallcaps">Gestión comercial</div><h1>Cotización inteligente</h1><div class="page-sub">${cw.tab==='Solicitud'?'Revisá el servicio solicitado.':cw.tab==='Preparación'?'Revisá las condiciones y prepará el precio.':'Revisá la propuesta y registrá la respuesta del cliente.'}</div></div><span class="badge navy">Demo · datos ficticios</span></div><div class="cw-layout"><aside class="cw-inbox"><div class="cw-inbox-head"><h3>Solicitudes</h3><label class="cw-field">Mostrar<select onchange="cw.filter=this.value;save();render()">${['Todas','Pendientes','Con trabajo'].map(x=>`<option ${cw.filter===x?'selected':''}>${x}</option>`).join('')}</select></label></div>${cw.cases.map((x,i)=>({x,i})).filter(({x})=>cw.filter==='Todas'||(cw.filter==='Con trabajo'?x.job:!x.job)).map(({x,i})=>`<button class="cw-request ${i===cw.selected?'active':''}" onclick="selectCase(${i})"><span class="smallcaps">${x.id}</span><strong>${esc(x.q.client)}</strong><span>${esc(x.q.service)}</span><span>${esc(x.q.quantity)} · ${esc(x.q.location)}</span><span class="cw-status">${esc(x.status)}</span></button>`).join('')||'<p class="cw-pad">No hay solicitudes en esta vista.</p>'}</aside><section class="cw-center"><div class="cw-heading"><div><h2>${esc(c.q.client)}</h2><p>${esc(c.q.service)} · ${esc(c.q.quantity)}</p></div>${v3Menu()}</div><nav class="cw-tabs" aria-label="Secciones de la cotización">${v3Tabs.map(t=>`<button class="${cw.tab===t?'active':''}" aria-current="${cw.tab===t?'page':'false'}" onclick="selectTab('${t}')">${t}</button>`).join('')}</nav><div class="cw-body">${cw.tab==='Solicitud'?v3Request():cw.tab==='Preparación'?v3Preparation():v3Proposal()}</div><footer class="v3-footer"><div><span class="cw-muted">${cw.tab==='Preparación'?'Total antes de impuestos':c.id+' · '+c.status}</span>${cw.tab==='Preparación'?`<strong id="cw-total">USD ${fmtMoney(quoteTotal())}</strong>`:''}</div><div class="v3-footer-actions">${cw.tab==='Propuesta'?btn('Ver / guardar PDF',"printCommercial()"):''}<span id="v3-primary">${v3Primary()}</span></div></footer></section><aside class="cw-context" id="cw-context">${contextPanel()}</aside></div></div>`};
function v3Request(){let q=C().q;return `<div class="v3-section-title"><h3>Solicitud recibida</h3><span class="cw-muted">Mensaje de ejemplo</span></div><div class="cw-message">Hola Hernán,<br><br>Solicitamos cotizar ${esc(q.service.toLowerCase())} para ${esc(q.quantity)} de ${esc(q.product.toLowerCase())} en ${esc(q.location)}. Fecha prevista: ${esc(q.date)}.<br><br>${esc(q.contact)}</div><h3>Datos del servicio</h3><div class="cw-form">${[['Servicio','service'],['Producto','product'],['Cantidad solicitada','quantity'],['Ubicación','location'],['Fecha del servicio','date']].map(([l,k])=>field(l,k,q[k],'change',k==='date'?'date':'text')).join('')}<label class="cw-field full">Observaciones<textarea onchange="change('notes',this.value)" ${locked()?'disabled':''}>${esc(q.notes)}</textarea></label></div>`}
function v3Prepare(){if(!locked()){reviewRequest();if(!C().requestReviewed)return}selectTab('Preparación')}
function v3Preparation(){let c=C(),a=c.agreement;return `<h3>Cliente y condiciones</h3><div class="cw-form">${field('Cliente','client',c.q.client)}${field('Contacto','contact',c.q.contact)}${field('Correo','email',c.q.email,'change','email')}${selectField('Relación comercial','clientType',a.clientType,['Cliente registrado','Cliente nuevo'])}${selectField('Modalidad del acuerdo','mode',a.mode,modes)}${field('Referencia del acuerdo','ref',a.ref,'agreementChange')}${field('Vigente desde','start',a.start,'agreementChange','date')}${field('Vigente hasta','end',a.end,'agreementChange','date')}<label class="cw-field full">Pago, validez de la propuesta y exclusiones<textarea onchange="agreementChange('terms',this.value)" ${locked()?'disabled':''}>${esc(a.terms)}</textarea></label></div><div class="v3-source"><strong>Origen de las condiciones</strong><p>${esc(a.source)}${c.doc?' · Documento disponible en •••.':'. Podés cargar un documento desde •••.'}</p></div><div class="v3-section-title"><h3>Precio de la propuesta</h3><span class="cw-muted">USD · antes de impuestos</span></div><p class="cw-muted">El markup es el porcentaje agregado al costo. Tarifario, referencias y conceptos adicionales en •••.</p>${v3RateTable()}<details class="v3-reference"><summary>Referencia para comparar</summary>${v3ReferenceCopy()}</details><label class="cw-check v3-review"><input id="v3-review" type="checkbox" ${v3Ready()?'checked':''} ${locked()?'disabled':''} onchange="v3Review(this.checked)"><span>Revisé el servicio, el cliente, las condiciones y el precio.<small>Confirmá la revisión para ver y enviar la propuesta.</small></span></label>${locked()?'<p class="cw-muted">Esta versión ya fue enviada y no se puede editar.</p>':''}`}
function v3RateTable(){return `<div class="v3-prices"><div class="v3-rate-header"><span>Concepto</span><span>Base</span><span>Cantidad</span><span>Tarifa USD</span><span>Markup %</span><span>Total USD</span></div>${C().q.lines.map((l,i)=>`<div class="v3-rate-row"><input aria-label="Concepto ${i+1}" value="${esc(l.concept)}" onchange="rateEdit(${i},'concept',this.value)" ${locked()?'disabled':''}><select aria-label="Base ${i+1}" onchange="rateEdit(${i},'basis',this.value)" ${locked()?'disabled':''}>${pricingBases.map(([k,v])=>`<option value="${k}" ${l.basis===k?'selected':''}>${v}</option>`).join('')}</select>${[['qty','Cantidad'],['rate','Tarifa USD'],['markup','Markup %']].map(([k,label])=>`<input aria-label="${label} ${i+1}" type="number" min="0" step="any" value="${l[k]??''}" onchange="rateEdit(${i},'${k}',this.value)" ${locked()?'disabled':''}>`).join('')}<strong id="sum-${i}">${fmtMoney(lineTotal(l))}</strong><div class="v3-rate-origin">Origen: ${esc(l.source||'Carga manual')}</div></div>`).join('')||'<p class="v3-empty">No hay conceptos. Agregá uno desde •••.</p>'}</div>`}
function v3ReferenceCopy(){return `<p>${C().q.location.includes('Villeta')?'Muestreo de soja en Villeta · agosto 2026.<br>Tres operaciones ficticias de 3.000 a 6.000 MT: USD 0,075 / 0,080 / 0,085 por tonelada. Mediana: USD 0,080.':'Control de carga en San Antonio · agosto 2026.<br>Dos operaciones ficticias: USD 360 y USD 400 por operación. Promedio: USD 380.'}</p><p class="cw-muted">Compará servicio, volumen y ubicación. Estas referencias no confirman disponibilidad ni incluyen impuestos. Usá ••• → Comparar tarifas si querés incorporar esta tarifa.</p>`}
function v3Review(value){if(locked())return;if(!value){C().requestReviewed=false;C().agreementReviewed=false;C().priceReviewed=false;log('Cotización pendiente de nueva revisión');save();contextRefresh();return}let q=C().q;if(['client','contact','service','product','quantity','location','date'].some(k=>!q[k].trim())||! /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(q.email)){toast('Completá los datos del servicio, cliente, contacto y correo.');contextRefresh();return}if(!validAgreement()){toast('Completá referencia y condiciones. La vigencia debe incluir la fecha del servicio.');contextRefresh();return}if(!validRates()){toast('Revisá conceptos, cantidades, tarifas y markup. El total debe ser mayor a cero.');contextRefresh();return}C().requestReviewed=true;C().agreementReviewed=true;C().priceReviewed=true;if(C().agreement.source==='Carga manual pendiente de revisión')C().agreement.source='Carga manual revisada por Hernán · demo';log('Servicio, acuerdo y precio revisados por Hernán · demo');save();contextRefresh()}
const v3OldContextRefresh=contextRefresh;contextRefresh=function(){v3OldContextRefresh();const r=document.getElementById('v3-review');if(r)r.checked=v3Ready();const p=document.getElementById('v3-primary');if(p)p.innerHTML=v3Primary()};
const v3OldChange=change;change=function(k,v){v3OldChange(k,v);if(!locked()){C().priceReviewed=false;save();contextRefresh()}};
function v3Proposal(){return `${commercialPaper()}${!v3Ready()?'<div class="v3-alert">Falta revisar la cotización en Preparación antes de enviarla.</div>':''}${locked()?'<p class="cw-muted">Esta versión conserva lo enviado al cliente. El envío y la aceptación son simulados.</p>':''}`}
function v3History(){dialog('Historial de la cotización',historyView())}
function v3SaveTariff(){if(!v3Ready())return toast('Revisá la cotización antes de guardar el tarifario.');saveManualTariff();toast('Tarifario guardado en el acuerdo.')}
function v3RemoveDialog(){dialog('Quitar concepto',`<label class="cw-field">Concepto<select id="v3-remove">${C().q.lines.map((l,i)=>`<option value="${i}">${esc(l.concept)} · USD ${fmtMoney(lineTotal(l))}</option>`).join('')}</select></label><p>El precio quedará pendiente de revisión.</p>${btn('Quitar concepto',"v3Remove()",true)}`)}
function v3Remove(){if(locked())return;let i=Number(document.getElementById('v3-remove').value);if(!C().q.lines[i])return;closeModal();removeCommercialLine(i)}
function v3Tariffs(){let c=C();dialog('Tarifas del acuerdo',c.tariff.length?`<p>${esc(c.agreement.ref)} · ${esc(c.agreement.mode)}<br>${esc(c.agreement.start)} a ${esc(c.agreement.end)}</p><p>${esc(c.agreement.terms)}</p><label class="cw-field">Tarifa<select id="v3-tariff">${c.tariff.map((t,i)=>`<option value="${i}">${esc(t.concept)} · USD ${fmtMoney(t.rate)} / ${esc(pricingLabel(t.basis))}</option>`).join('')}</select></label><p class="cw-muted">Se actualizará el concepto coincidente o se agregará a la propuesta. Revisá cantidad y precio después de aplicarlo.</p>${btn(c.agreementReviewed?'Usar tarifa':'Confirmar acuerdo y usar tarifa',"v3UseTariff()",true,locked()||!validAgreement())}`:`<p>No hay tarifas guardadas en este acuerdo. Podés leerlas de un documento o guardar el precio revisado como tarifario.</p>${btn('Cargar documento',"v3Document()",true,locked())}`)}
function v3UseTariff(){if(locked()||!validAgreement())return;const i=Number(document.getElementById('v3-tariff').value);if(!C().tariff[i])return;if(!C().agreementReviewed)reviewAgreement(true);if(!C().agreementReviewed)return;useTariff(i);closeModal();render()}
function v3References(){dialog('Comparar tarifas',v3ReferenceCopy()+btn('Usar tarifa de referencia',"v3UseReference()",true,locked()))}
function v3UseReference(){if(locked())return;applySuggestion();closeModal();render()}
function v3RevisionDialog(){dialog('Crear nueva versión',`<p>La propuesta anterior quedará en el historial. La nueva versión deberá revisarse, enviarse y aceptarse de nuevo.</p>${btn('Crear nueva versión',"v3Revision()",true)}`)}
function v3Revision(){if(!['Enviada','Aceptada'].includes(C().status))return;reviseCommercial();closeModal();selectTab('Preparación')}
function v3Document(){v3DocumentOpen=true;let c=C();dialog('Documento del acuerdo',`<div class="v3-document"><p class="cw-muted">Usá un TXT o pegá el texto con el formato del ejemplo. Esta demo no lee PDF ni imágenes.</p>${!locked()?`<div class="cw-actions">${btn('Cargar ejemplo',"loadExample()") }<label class="secondary-btn cw-file">Abrir TXT<input aria-label="Abrir documento TXT" type="file" accept=".txt,text/plain" onchange="readTextFile(this)"></label></div>`:''}<label class="cw-field">Texto del documento<textarea class="cw-source" oninput="v3DocumentText(this.value)" ${locked()?'disabled':''}>${esc(c.doc)}</textarea></label><div id="v3-extraction">${c.extracted?v3Extraction():''}</div><div id="v3-doc-action">${!locked()?btn(c.extracted?'Confirmar datos y usar en la cotización':'Leer documento',c.extracted?'v3ApplyDocument()':'extractDocument()',true,!c.doc.trim()):''}</div></div>`)}
function v3DocumentText(value){if(locked())return;C().doc=value;C().extracted=false;C().agreementReviewed=false;save();document.getElementById('v3-extraction').innerHTML='';document.getElementById('v3-doc-action').innerHTML=btn('Leer documento','extractDocument()',true,!value.trim());contextRefresh()}
function v3Extraction(){let e=C().extraction;return `<div class="cw-extraction"><h3>Revisá los datos encontrados</h3>${Object.entries(e).filter(([k])=>k!=='tariff').map(([k,v])=>`<div class="detail-row"><div>${({client:'Cliente',mode:'Modalidad',ref:'Referencia',start:'Desde',end:'Hasta',terms:'Condiciones'})[k]}</div><div>${esc(v||'No encontrado')}</div></div>`).join('')}<p>${e.tariff.length} tarifas: ${e.tariff.map(t=>`${esc(t.concept)} · USD ${fmtMoney(t.rate)}`).join('; ')||'ninguna'}.</p><p class="cw-muted">Al confirmar, estos datos se incorporan al borrador. La revisión final de la cotización sigue pendiente.</p></div>`}
const v3LoadExample=loadExample;loadExample=function(){v3LoadExample();if(v3DocumentOpen)v3Document()};
const v3Extract=extractDocument;extractDocument=function(){v3Extract();if(v3DocumentOpen)v3Document()};
const v3ReadFile=readTextFile;readTextFile=async function(input){await v3ReadFile(input);if(v3DocumentOpen)v3Document()};
function v3ApplyDocument(){if(locked())return;applyExtraction();if(C().extracted)return;closeModal();selectTab('Preparación')}
sendDialog=function(){if(!v3Ready()||locked())return;if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(C().q.email)||!C().q.contact.trim())return toast('Completá contacto y correo en Preparación.');dialog('Enviar propuesta',`<p>${C().id} · Versión ${C().revision}<br>${esc(C().q.contact)} · ${esc(C().q.email)}</p><label class="cw-field">Canal<select id="send-channel"><option>Correo</option><option>WhatsApp</option><option>Compartir</option></select></label><p class="cw-muted">Envío simulado. No se enviará ningún mensaje externo.</p>${btn('Confirmar envío simulado',"sendCommercial()",true)}`)};
// Keep legacy entry points pointing at the same simulated dispatch.
sendEmail=sendWhatsApp=shareProposal=sendDialog;
const v3OpenModal=openModal;openModal=function(content){document.querySelectorAll('.v3-menu[open]').forEach(e=>e.removeAttribute('open'));document.body.classList.toggle('v3-dialog-open',state.view==='quotes');v3OpenModal(content)};
const v3CloseModal=closeModal;closeModal=function(){v3DocumentOpen=false;document.body.classList.remove('v3-dialog-open');v3CloseModal()};
cw.tab=v3Tab(cw.tab);save();render();
</script><style>/* Reporte Agro — scoped module. Canonical report remains the supplied raster. */
