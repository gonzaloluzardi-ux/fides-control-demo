<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fides Control — Concept Demo v0.3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style-01.css">
</head>
<body>
<div class="mobile-header">
  <div class="mobile-brand"><img src="assets/fides-logo.webp" alt="Fides Control">FIDES CONTROL</div>
  <button class="mobile-menu" onclick="toggleMenu()">☰</button>
</div>
<aside class="sidebar" id="sidebar">
  <div class="brand"><img src="assets/fides-logo.webp" alt="Fides Control"></div>
  <nav class="nav">
    <button class="nav-btn active" data-key="home" onclick="go('home')"><span class="icon"><svg viewBox="0 0 24 24"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M9 20v-6h6v6"/></svg></span>Inicio</button>
    <button class="nav-btn" data-key="jobs" onclick="go('jobs')"><span class="icon"><svg viewBox="0 0 24 24"><path d="M8 4h8M9 3h6v3H9z"/><rect x="5" y="5" width="14" height="16" rx="2"/><path d="M9 10h6M9 14h6M9 18h4"/></svg></span>Trabajos</button>
    <button class="nav-btn" data-key="quotes" onclick="go('quotes')"><span class="icon"><svg viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6z"/><path d="M15 3v4h4"/><path d="M9 11h6M9 15h6"/></svg></span>Cotizaciones</button>
    <button class="nav-btn" data-key="clients" onclick="goPlaceholder('Clientes','clients')"><span class="icon"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="10" r="2"/><path d="M3 20c0-4 2-7 6-7s6 3 6 7"/><path d="M14 15c3 0 5 2 5 5"/></svg></span>Clientes</button>
    <button class="nav-btn" data-key="operations" onclick="goPlaceholder('Operaciones','operations')"><span class="icon"><svg viewBox="0 0 24 24"><path d="m4 8 8-4 8 4-8 4z"/><path d="m4 8v8l8 4 8-4V8"/><path d="M12 12v8"/></svg></span>Operaciones</button>
    <button class="nav-btn" data-key="evidence" onclick="goPlaceholder('Evidencias','evidence')"><span class="icon"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M8 5l1-2h6l1 2"/></svg></span>Evidencias <span class="nav-badge">3</span></button>
    <button class="nav-btn" data-key="reports" onclick="goPlaceholder('Reportes','reports')"><span class="icon"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M9 17v-5M12 17V9M15 17v-3"/></svg></span>Reportes</button>
    <button class="nav-btn" data-key="finance" onclick="goPlaceholder('Finanzas','finance')"><span class="icon"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 16h6M12 6v12"/></svg></span>Finanzas</button>
    <button class="nav-btn" data-key="agro" onclick="goPlaceholder('Reporte Agro','agro')"><span class="icon"><svg viewBox="0 0 24 24"><path d="M20 4C12 4 6 8 5 16c5 1 10-1 13-5 2-3 2-7 2-7Z"/><path d="M5 20c2-6 6-9 12-12"/></svg></span>Reporte Agro</button>
    <button class="nav-btn" data-key="assistant" onclick="goPlaceholder('Asistente IA','assistant')"><span class="icon"><svg viewBox="0 0 24 24"><path d="m12 2 1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8z"/></svg></span>Asistente IA</button>
  </nav>
  <div class="sidebar-bottom">
    <div class="sidebar-rule"></div>
    <div class="user-row"><div class="avatar">HG</div><div><div class="user-name">Hernán González</div><div class="user-role">Administrador</div></div></div>
    <div class="settings"><span class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.4-2.4 1a7 7 0 0 0-1.7-1L14.5 3h-5l-.3 3.1a7 7 0 0 0-1.7 1l-2.4-1-2 3.4L5.1 11a7 7 0 0 0 0 2l-2 1.5 2 3.4 2.4-1a7 7 0 0 0 1.7 1l.3 3.1h5l.3-3.1a7 7 0 0 0 1.7-1l2.4 1 2-3.4-2-1.5a7 7 0 0 0 .1-1Z"/></svg></span>Configuración</div>
  </div>
</aside>

<main class="app">
  <div class="topbar">
    <div class="top-tools">
      <button class="search-trigger" onclick="openSearch()"><span class="icon"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg></span>Buscar trabajos por cliente o servicio...</button>
      <button class="bell" onclick="openNotifications()"><span class="icon"><svg viewBox="0 0 24 24"><path d="M6.5 9a5.5 5.5 0 0 1 11 0v4l2 3H4.5l2-3z"/><path d="M10 19h4"/></svg></span></button>
    </div>
  </div>
  <div class="workspace" id="workspace"></div>
</main>

<div class="modal-layer" id="modalLayer" onclick="modalBackdrop(event)">
  <div class="modal"><div id="modalContent"></div></div>
</div>
<div class="toast" id="toast"></div>

<script src="js/script-01.js"></script>
<script src="js/script-02.js"></script>
<link rel="stylesheet" href="css/style-04.css"><script src="js/script-03.js"></script><link rel="stylesheet" href="css/style-05.css"><script src="js/script-04.js"></script>
<link rel="stylesheet" href="css/style-06.css">
<script src="js/script-05.js"></script>

<link rel="stylesheet" href="css/style-08.css">
</body>
</html>
